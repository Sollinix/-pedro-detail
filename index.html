v><b style="font-size:24px">${humanTime(currentTimer(o))}</b></div><div class="form-actions"><button class="${o.timer?.startedAt?'btn-pink':'btn-green'}" data-action="timer-toggle" data-id="${o.id}">${o.timer?.startedAt?'Pausar':'Iniciar'} cronômetro</button><button class="btn-ghost" data-action="timer-reset" data-id="${o.id}">Zerar</button></div></div><div class="form-actions section"><button class="btn-green" data-action="save-order-summary" data-id="${o.id}">Salvar alterações</button><button class="btn-ghost" data-action="print-order" data-id="${o.id}">Relatório / PDF</button><button class="btn-danger" data-action="delete-order" data-id="${o.id}">Excluir OS</button></div>`}
function carSVG(){return `<svg class="car-svg" viewBox="0 0 700 300" fill="none"><rect x="220" y="35" width="260" height="230" rx="85" stroke="#79ff00" stroke-width="7"/><path d="M250 78h200M250 222h200M260 95l35 45h110l35-45M260 205l35-45h110l35 45" stroke="#ff00c8" stroke-width="5"/><rect x="175" y="75" width="50" height="65" rx="18" stroke="#79ff00" stroke-width="6"/><rect x="475" y="75" width="50" height="65" rx="18" stroke="#79ff00" stroke-width="6"/><rect x="175" y="160" width="50" height="65" rx="18" stroke="#79ff00" stroke-width="6"/><rect x="475" y="160" width="50" height="65" rx="18" stroke="#79ff00" stroke-width="6"/><text x="350" y="24" fill="#999" text-anchor="middle" font-size="16">FRENTE</text><text x="350" y="292" fill="#999" text-anchor="middle" font-size="16">TRASEIRA</text></svg>`}
function orderInspection(o){let i=o.inspection||{};return `<div class="grid cols-2"><div><div class="form-grid"><div class="field-group"><label class="label">KM entrada</label><input id="inKm" class="field" value="${esc(i.km||'')}"></div><div class="field-group"><label class="label">Combustível</label><select id="inFuel" class="select">${['Reserva','1/4','1/2','3/4','Cheio'].map(x=>`<option ${i.fuel===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field-group wide"><label class="label">Objetos / pertences</label><textarea id="inBelongings" class="textarea">${esc(i.belongings||'')}</textarea></div><div class="field-group wide"><label class="label">Observações de entrada</label><textarea id="inNotes" class="textarea">${esc(i.notes||'')}</textarea></div></div><div class="form-actions" style="margin-top:12px"><button class="btn-green" data-action="save-inspection" data-id="${o.id}">Salvar entrada</button><button class="btn-ghost" data-action="signature" data-id="${o.id}">${i.signature?'Refazer assinatura':'Coletar assinatura'}</button></div>${i.signature?'<div class="hint" style="margin-top:8px">✓ Assinatura registrada</div>':''}</div><div><div class="car-map">${carSVG()}</div><div class="form-actions" style="margin-top:10px"><button class="btn-pink" data-action="add-damage" data-id="${o.id}">+ Marcar avaria</button></div><div class="section">${(i.damages||[]).map(d=>`<span class="damage-chip">${esc(d.location)} • ${esc(d.type)} <button style="border:0;background:none;color:#fff" data-action="delete-damage" data-id="${o.id}" data-damage="${d.id}">×</button></span>`).join('')||'<div class="hint">Nenhuma avaria registrada.</div>'}</div></div></div>`}
function orderProcess(o){let grouped={};(o.steps||[]).forEach((s,n)=>(grouped[s.group]??=[]).push([s,n]));return `<div class="section-head"><div><h3>Checklist operacional</h3><p class="section-sub">Marque cada etapa conforme executar.</p></div><span class="badge green">${orderProgress(o)}%</span></div>${Object.entries(grouped).map(([g,rows])=>`<div class="check-group"><div class="check-title">${esc(g)}</div>${rows.map(([s,n])=>`<div class="check-row ${s.done?'done':''}"><input type="checkbox" data-action="toggle-step" data-id="${o.id}" data-step="${n}" ${s.done?'checked':''}><label>${esc(s.label)}</label></div>`).join('')}</div>`).join('')}`}
function orderPhotos(o){return `<div class="section-head"><div><h3>Fotos da OS</h3><p class="section-sub">Entrada, avarias, processo, antes e depois. As fotos ficam armazenadas no aparelho.</p></div></div><div class="form-grid"><div class="field-group"><label class="label">Categoria</label><select id="photoType" class="select"><option value="entrada">Entrada</option><option value="avaria">Avaria</option><option value="processo">Processo</option><option value="final">Final / Depois</option></select></div><div class="field-group"><label class="label">Visível ao cliente no futuro</label><select id="photoVisible" class="select"><option value="false">Somente interno</option><option value="true">Pode exibir ao cliente</option></select></div><div class="field-group wide"><label class="btn-green" style="text-align:center">📷 Adicionar foto<input id="photoInput" type="file" accept="image/*" capture="environment" hidden></label></div></div><div id="photoGrid" class="photo-grid section"><div class="empty">Carregando fotos...</div></div>`}
function orderCosts(o){let total=totalOrder(o),paid=paidAmount(o),mat=materialCost(o),lab=laborCost(o);return `<div class="grid cols-4"><div class="card soft"><div class="metric-label">TOTAL</div><div class="metric-value">${brl(total)}</div></div><div class="card soft"><div class="metric-label">RECEBIDO</div><div class="metric-value">${brl(paid)}</div></div><div class="card soft"><div class="metric-label">CUSTO</div><div class="metric-value">${brl(mat+lab+Number(o.otherCost||0))}</div></div><div class="card soft"><div class="metric-label">LUCRO EST.</div><div class="metric-value">${brl(profitOrder(o))}</div></div></div><div class="section grid cols-2"><div class="card soft"><div class="section-head"><h3>Serviços adicionais</h3><button class="btn-pink" data-action="add-addon" data-id="${o.id}">+ Adicional</button></div>${(o.addons||[]).length?o.addons.map(a=>`<div class="kpi-line"><div><b>${esc(a.name)}</b><div class="hint">${brl(a.price)} • ${esc(a.status)}</div></div><div><button class="btn-ghost" data-action="addon-status" data-id="${o.id}" data-addon="${a.id}" data-status="approved">✓</button><button class="btn-danger" data-action="addon-status" data-id="${o.id}" data-addon="${a.id}" data-status="rejected">×</button></div></div>`).join(''):'<div class="empty">Nenhum adicional.</div>'}</div><div class="card soft"><div class="section-head"><h3>Pagamentos</h3><button class="btn-green" data-action="add-payment" data-id="${o.id}">+ Pagamento</button></div>${(o.payments||[]).length?o.payments.map(p=>`<div class="kpi-line"><div><b>${brl(p.amount)}</b><div class="hint">${esc(p.method)} • ${fmt(p.date)}</div></div><div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end"><button class="btn-ghost" data-action="edit-payment" data-id="${o.id}" data-payment="${p.id}">✎ Editar</button><button class="btn-danger" data-action="delete-payment" data-id="${o.id}" data-payment="${p.id}">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhum pagamento.</div>'}</div></div><div class="section grid cols-2"><div class="card soft"><div class="section-head"><h3>Consumo de produtos</h3><button class="btn-green" data-action="add-consumption" data-id="${o.id}">+ Produto</button></div>${(o.consumptions||[]).length?o.consumptions.map(c=>`<div class="kpi-line"><div><b>${esc(c.name)}</b><div class="hint">${c.qty} ${esc(c.unit)} • ${brl(c.cost)}</div></div></div>`).join(''):'<div class="empty">Nenhum consumo lançado.</div>'}</div><div class="card soft"><h3>Outros custos</h3><div class="field-group"><label class="label">Valor</label><input id="otherCost" class="field" type="number" step=".01" value="${o.otherCost||0}"></div><button class="btn-green" style="margin-top:10px" data-action="save-other-cost" data-id="${o.id}">Salvar custo</button><div class="separator"></div><div class="kpi-line"><span>Materiais</span><b>${brl(mat)}</b></div><div class="kpi-line"><span>Mão de obra</span><b>${brl(lab)}</b></div></div></div>`}
function orderQuality(o){return `<div class="section-head"><div><h3>Controle de qualidade</h3><p class="section-sub">Conferência final antes de entregar.</p></div><span class="badge ${qualityProgress(o)===100?'green':'warn'}">${qualityProgress(o)}%</span></div><div class="check-group"><div class="check-title">CONFERÊNCIA FINAL</div>${(o.quality||[]).map((q,n)=>`<div class="check-row ${q.done?'done':''}"><input type="checkbox" data-action="toggle-quality" data-id="${o.id}" data-step="${n}" ${q.done?'checked':''}><label>${esc(q.label)}</label></div>`).join('')}</div><div class="section grid cols-2"><div class="card soft"><h3>Avaliação do cliente</h3><div class="field-group"><label class="label">Nota de 1 a 5</label><select id="reviewRating" class="select"><option value="">Sem avaliação</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${n} ★</option>`).join('')}</select></div><div class="field-group" style="margin-top:8px"><label class="label">Comentário</label><textarea id="reviewComment" class="textarea"></textarea></div><button class="btn-green" style="margin-top:10px" data-action="save-review" data-id="${o.id}">Registrar avaliação</button></div><div class="card soft"><h3>Entrega</h3><div class="kpi-line"><span>Checklist</span><b>${orderProgress(o)}%</b></div><div class="kpi-line"><span>Qualidade</span><b>${qualityProgress(o)}%</b></div><div class="kpi-line"><span>Pagamento</span><b>${brl(paidAmount(o))} / ${brl(totalOrder(o))}</b></div><div class="form-actions" style="margin-top:12px"><button class="btn-green" data-action="finish-order" data-id="${o.id}">Finalizar e entregar</button><button class="btn-ghost" data-action="print-order" data-id="${o.id}">Relatório</button></div></div></div>`}
function stockForm(s={}){return `<form id="stockForm"><div class="form-grid"><div class="field-group"><label class="label">Produto</label><input class="field" name="name" required value="${esc(s.name||'')}"></div><div class="field-group"><label class="label">Categoria</label><input class="field" name="category" value="${esc(s.category||'')}"></div><div class="field-group"><label class="label">Quantidade</label><input class="field" type="number" step=".01" name="qty" value="${s.qty||0}"></div><div class="field-group"><label class="label">Unidade</label><select class="select" name="unit">${['un','ml','L','g','kg'].map(x=>`<option ${s.unit===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field-group"><label class="label">Estoque mínimo</label><input class="field" type="number" step=".01" name="min" value="${s.min||0}"></div><div class="field-group"><label class="label">Custo por unidade</label><input class="field" type="number" step=".01" name="cost" value="${s.cost||0}"></div><div class="field-group"><label class="label">Diluição</label><input class="field" name="dilution" placeholder="Ex.: 1:10" value="${esc(s.dilution||'')}"></div><div class="field-group"><label class="label">Fornecedor</label><input class="field" name="supplier" value="${esc(s.supplier||'')}"></div></div><div class="form-actions" style="margin-top:15px"><button class="btn-green">Salvar</button>${s.id?`<button type="button" class="btn-danger" data-action="delete-stock" data-id="${s.id}">Excluir</button>`:''}</div></form>`}
function openStock(id){let s=id?state.stock.find(x=>x.id===id):{};modal(id?'Editar produto':'Novo produto',stockForm(s),'ESTOQUE');$('stockForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));['qty','min','cost'].forEach(k=>d[k]=Number(d[k]||0));if(id)Object.assign(s,d);else state.stock.push({id:uid('stk'),...d});save();closeModal();notify('Estoque atualizado.');render()}}
function openExpense(){modal('Nova despesa',`<form id="expenseForm"><div class="form-grid"><div class="field-group"><label class="label">Data</label><input class="field" type="date" name="date" value="${today()}"></div><div class="field-group"><label class="label">Valor</label><input class="field" type="number" step=".01" name="amount" required></div><div class="field-group"><label class="label">Categoria</label><input class="field" name="category" placeholder="Aluguel, energia, marketing..."></div><div class="field-group"><label class="label">Descrição</label><input class="field" name="description" required></div></div><button class="btn-green" style="margin-top:15px">Salvar</button></form>`,'FINANCEIRO');$('expenseForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.amount=Number(d.amount||0);state.expenses.push({id:uid('exp'),...d});save();closeModal();notify('Despesa lançada.');render()}}
function openFinanceMetric(field){let month=today().slice(0,7),labels={received:'Recebido',receivable:'A receber',expenses:'Despesas',result:'Resultado estimado'},orders=state.orders.filter(o=>(o.date||'').slice(0,7)===month&&!['cancelado'].includes(o.status)),rev=orders.reduce((a,o)=>a+paidAmount(o),0),expected=orders.reduce((a,o)=>a+totalOrder(o),0),expenses=state.expenses.filter(e=>(e.date||'').slice(0,7)===month).reduce((a,e)=>a+Number(e.amount||0),0),materials=orders.reduce((a,o)=>a+materialCost(o),0),labor=orders.reduce((a,o)=>a+laborCost(o),0),auto={received:rev,receivable:Math.max(0,expected-rev),expenses:expenses,result:expected-expenses-materials-labor},ov=(state.financeOverrides||{})[month]||{},current=ov[field]===undefined?auto[field]:ov[field];modal('Editar '+labels[field],`<form id="financeMetricForm"><div class="field-group"><label class="label">Valor exibido</label><input id="financeMetricValue" class="field" type="number" step="0.01" inputmode="decimal" value="${Number(current||0)}" required></div><div class="card soft" style="margin-top:12px"><div class="hint">Cálculo automático atual</div><b style="font-size:22px">${brl(auto[field])}</b><div class="hint" style="margin-top:8px">Ao salvar, este card passa a usar um valor manual neste mês. Isso não altera as OS, pagamentos ou despesas lançadas.</div></div><div class="form-actions" style="margin-top:15px"><button class="btn-green" type="submit">Salvar valor</button><button class="btn-ghost" type="button" data-action="reset-finance-metric" data-field="${field}">Usar automático</button></div></form>`,'FINANCEIRO');$('financeMetricForm').onsubmit=e=>{e.preventDefault();state.financeOverrides=state.financeOverrides||{};state.financeOverrides[month]=state.financeOverrides[month]||{};state.financeOverrides[month][field]=Number($('financeMetricValue').value||0);save();closeModal();notify('Valor financeiro atualizado.');render()}}
function resetFinanceMetric(field){let month=today().slice(0,7);if(state.financeOverrides?.[month]){delete state.financeOverrides[month][field];if(!Object.keys(state.financeOverrides[month]).length)delete state.financeOverrides[month]}save();closeModal();notify('Cálculo automático restaurado.');render()}

function employeeForm(e={}){return `<form id="employeeForm"><div class="form-grid"><div class="field-group"><label class="label">Nome</label><input class="field" name="name" required value="${esc(e.name||'')}"></div><div class="field-group"><label class="label">Função</label><input class="field" name="role" value="${esc(e.role||'Detailer')}"></div><div class="field-group"><label class="label">Telefone</label><input class="field" name="phone" value="${esc(e.phone||'')}"></div><div class="field-group"><label class="label">Custo/hora</label><input class="field" type="number" step=".01" name="hourlyCost" value="${e.hourlyCost||0}"></div><div class="field-group"><label class="label">Ativo</label><select class="select" name="active"><option value="true">Sim</option><option value="false" ${e.active===false?'selected':''}>Não</option></select></div></div><button class="btn-green" style="margin-top:15px">Salvar</button></form>`}
function openEmployee(id){let e=id?state.employees.find(x=>x.id===id):{};modal(id?'Editar funcionário':'Novo funcionário',employeeForm(e),'EQUIPE');$('employeeForm').onsubmit=x=>{x.preventDefault();let d=Object.fromEntries(new FormData(x.target));d.hourlyCost=Number(d.hourlyCost||0);d.active=d.active==='true';if(id)Object.assign(e,d);else state.employees.push({id:uid('emp'),...d});save();closeModal();render()}}
function openEquipment(id){let e=id?state.equipment.find(x=>x.id===id):{};modal(id?'Editar equipamento':'Novo equipamento',`<form id="equipmentForm"><div class="form-grid"><div class="field-group"><label class="label">Equipamento</label><input class="field" name="name" required value="${esc(e.name||'')}"></div><div class="field-group"><label class="label">Marca/modelo</label><input class="field" name="brand" value="${esc(e.brand||'')}"></div><div class="field-group"><label class="label">Status</label><select class="select" name="status"><option value="ok">OK</option><option value="manutencao" ${e.status==='manutencao'?'selected':''}>Manutenção</option><option value="fora" ${e.status==='fora'?'selected':''}>Fora de uso</option></select></div><div class="field-group"><label class="label">Última manutenção</label><input class="field" type="date" name="lastMaintenance" value="${esc(e.lastMaintenance||'')}"></div><div class="field-group"><label class="label">Próxima manutenção</label><input class="field" type="date" name="nextMaintenance" value="${esc(e.nextMaintenance||'')}"></div><div class="field-group wide"><label class="label">Observações</label><textarea class="textarea" name="notes">${esc(e.notes||'')}</textarea></div></div><button class="btn-green" style="margin-top:15px">Salvar</button></form>`,'EQUIPAMENTOS');$('equipmentForm').onsubmit=x=>{x.preventDefault();let d=Object.fromEntries(new FormData(x.target));if(id)Object.assign(e,d);else state.equipment.push({id:uid('eq'),...d});save();closeModal();render()}}
function openPlan(id){let p=id?state.plans.find(x=>x.id===id):{};modal(id?'Editar plano':'Novo plano',`<form id="planForm"><div class="form-grid"><div class="field-group"><label class="label">Nome</label><input class="field" name="name" required value="${esc(p.name||'')}"></div><div class="field-group"><label class="label">Preço</label><input class="field" type="number" step=".01" name="price" value="${p.price||0}"></div><div class="field-group"><label class="label">Visitas</label><input class="field" type="number" name="visits" value="${p.visits||4}"></div><div class="field-group"><label class="label">Validade em dias</label><input class="field" type="number" name="validity" value="${p.validity||30}"></div><div class="field-group wide"><label class="label">Benefícios</label><textarea class="textarea" name="benefits">${esc(p.benefits||'')}</textarea></div></div><button class="btn-green" style="margin-top:15px">Salvar</button></form>`,'PLANOS');$('planForm').onsubmit=x=>{x.preventDefault();let d=Object.fromEntries(new FormData(x.target));['price','visits','validity'].forEach(k=>d[k]=Number(d[k]||0));if(id)Object.assign(p,d);else state.plans.push({id:uid('pln'),...d});save();closeModal();render()}}
function openCoupon(id){let c=id?state.coupons.find(x=>x.id===id):{};modal(id?'Editar cupom':'Novo cupom',`<form id="couponForm"><div class="form-grid"><div class="field-group"><label class="label">Código</label><input class="field" name="code" required value="${esc(c.code||'')}"></div><div class="field-group"><label class="label">Tipo</label><select class="select" name="type"><option value="percent">Percentual (%)</option><option value="fixed" ${c.type==='fixed'?'selected':''}>Valor fixo (R$)</option></select></div><div class="field-group"><label class="label">Valor</label><input class="field" type="number" step=".01" name="value" value="${c.value||0}"></div><div class="field-group"><label class="label">Ativo</label><select class="select" name="active"><option value="true">Sim</option><option value="false" ${c.active===false?'selected':''}>Não</option></select></div></div><button class="btn-green" style="margin-top:15px">Salvar</button></form>`,'CUPONS');$('couponForm').onsubmit=x=>{x.preventDefault();let d=Object.fromEntries(new FormData(x.target));d.value=Number(d.value||0);d.active=d.active==='true';if(id)Object.assign(c,d);else state.coupons.push({id:uid('cup'),...d});save();closeModal();render()}}
function openSubscription(clientId,id){let s=id?state.subscriptions.find(x=>x.id===id):{clientId};if(!state.plans.length)return notify('Cadastre um plano primeiro.');modal(id?'Editar assinatura':'Assinar plano',`<form id="subForm"><div class="form-grid"><div class="field-group"><label class="label">Cliente</label><select class="select" name="clientId">${opts(state.clients,s.clientId)}</select></div><div class="field-group"><label class="label">Plano</label><select class="select" name="planId">${opts(state.plans,s.planId)}</select></div><div class="field-group"><label class="label">Data início</label><input class="field" type="date" name="startedAt" value="${s.startedAt||today()}"></div><div class="field-group"><label class="label">Vencimento</label><input class="field" type="date" name="expiresAt" value="${s.expiresAt||''}"></div><div class="field-group"><label class="label">Visitas usadas</label><input class="field" type="number" name="used" value="${s.used||0}"></div></div><button class="btn-green" style="margin-top:15px">Salvar</button></form>`,'PLANOS');$('subForm').onsubmit=x=>{x.preventDefault();let d=Object.fromEntries(new FormData(x.target));d.used=Number(d.used||0);if(!d.expiresAt){let p=state.plans.find(p=>p.id===d.planId),dt=new Date(d.startedAt);dt.setDate(dt.getDate()+Number(p?.validity||30));d.expiresAt=dt.toISOString().slice(0,10)}if(id)Object.assign(s,d);else state.subscriptions.push({id:uid('sub'),...d});save();closeModal();render()}}
function previewTemplate(id){let t=templates[id];modal(t.name,t.groups.map(([g,items])=>`<div class="check-group"><div class="check-title">${esc(g)}</div>${items.map(i=>`<div class="check-row"><input type="checkbox" disabled><label>${esc(i)}</label></div>`).join('')}</div>`).join(''),'CHECKLIST INTERNO')}
function addDamage(orderId){modal('Registrar avaria',`<form id="damageForm"><div class="form-grid"><div class="field-group"><label class="label">Local</label><select class="select" name="location">${['Frente','Traseira','Lateral esquerda','Lateral direita','Teto','Roda dianteira esquerda','Roda dianteira direita','Roda traseira esquerda','Roda traseira direita','Interior'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field-group"><label class="label">Tipo</label><select class="select" name="type">${['Risco','Amassado','Trinca','Ralado','Quebra','Mancha','Outro'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field-group wide"><label class="label">Descrição</label><textarea class="textarea" name="note"></textarea></div></div><button class="btn-pink" style="margin-top:14px">Registrar</button></form>`,'INSPEÇÃO');$('damageForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),o=order(orderId);o.inspection.damages.push({id:uid('dam'),...d});save();closeModal();openOrder(orderId,'inspection')}}
function openSignature(orderId){modal('Assinatura do cliente',`<canvas id="signCanvas" class="signature"></canvas><p class="hint">Assine com o dedo dentro da área branca.</p><div class="form-actions"><button class="btn-ghost" data-action="clear-signature">Limpar</button><button class="btn-green" data-action="save-signature" data-id="${orderId}">Salvar assinatura</button></div>`,'ENTRADA');let c=$('signCanvas'),ctx=c.getContext('2d'),r=c.getBoundingClientRect();c.width=Math.max(600,r.width*2);c.height=440;ctx.scale(c.width/r.width,c.height/r.height);ctx.strokeStyle='#111';ctx.lineWidth=2.3;ctx.lineCap='round';let down=false,last=null;const pos=e=>{let q=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return [p.clientX-q.left,p.clientY-q.top]};const start=e=>{down=true;last=pos(e);e.preventDefault()},move=e=>{if(!down)return;let p=pos(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p;e.preventDefault()},end=()=>down=false;c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:false})}
function addAddon(id){modal('Serviço adicional',`<form id="addonForm"><div class="form-grid"><div class="field-group"><label class="label">Descrição</label><input class="field" name="name" required></div><div class="field-group"><label class="label">Valor</label><input class="field" type="number" step=".01" name="price" required></div><div class="field-group wide"><label class="label">Motivo</label><textarea class="textarea" name="reason"></textarea></div></div><button class="btn-pink" style="margin-top:14px">Adicionar pendente</button></form>`,'ADICIONAL');$('addonForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),o=order(id);o.addons.push({id:uid('add'),...d,price:Number(d.price||0),status:'pending'});save();closeModal();openOrder(id,'costs')}}
function updatePaymentStatus(o){let p=paidAmount(o),t=totalOrder(o);o.paymentStatus=p>=t&&p>0?'pago':p>0?'parcial':'pendente'}
function addPayment(id){modal('Registrar pagamento',`<form id="paymentForm"><div class="form-grid"><div class="field-group"><label class="label">Valor</label><input class="field" type="number" step=".01" min="0.01" inputmode="decimal" name="amount" required></div><div class="field-group"><label class="label">Forma</label><select class="select" name="method"><option>Pix</option><option>Dinheiro</option><option>Cartão débito</option><option>Cartão crédito</option><option>Outro</option></select></div><div class="field-group"><label class="label">Data</label><input class="field" type="date" name="date" value="${today()}"></div></div><div class="hint" style="margin-top:10px">Antes de registrar, confira se este pagamento já não foi lançado.</div><button class="btn-green" style="margin-top:14px">Registrar</button></form>`,'PAGAMENTO');$('paymentForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),o=order(id);d.amount=Number(d.amount||0);let duplicate=(o.payments||[]).some(p=>Number(p.amount||0)===d.amount&&p.method===d.method&&p.date===d.date);if(duplicate&&!confirm('Já existe um pagamento com o mesmo valor, forma e data nesta OS. Deseja registrar mesmo assim?'))return;o.payments.push({id:uid('pay'),...d});updatePaymentStatus(o);save();closeModal();openOrder(id,'costs')}}
function editPayment(orderId,paymentId){let o=order(orderId),p=(o?.payments||[]).find(x=>x.id===paymentId);if(!o||!p)return;let methods=['Pix','Dinheiro','Cartão débito','Cartão crédito','Outro'];modal('Editar pagamento',`<form id="paymentEditForm"><div class="form-grid"><div class="field-group"><label class="label">Valor recebido</label><input class="field" type="number" step=".01" min="0.01" inputmode="decimal" name="amount" value="${Number(p.amount||0)}" required></div><div class="field-group"><label class="label">Forma de pagamento</label><select class="select" name="method">${methods.map(m=>`<option ${p.method===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="field-group"><label class="label">Data</label><input class="field" type="date" name="date" value="${p.date||today()}"></div></div><div class="form-actions" style="margin-top:14px"><button class="btn-green" type="submit">Salvar alterações</button><button class="btn-danger" type="button" data-action="delete-payment" data-id="${orderId}" data-payment="${paymentId}">Excluir pagamento</button></div></form>`,'PAGAMENTO');$('paymentEditForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));p.amount=Number(d.amount||0);p.method=d.method;p.date=d.date;updatePaymentStatus(o);save();closeModal();notify('Pagamento atualizado.');openOrder(orderId,'costs')}}
function deletePayment(orderId,paymentId){let o=order(orderId),p=(o?.payments||[]).find(x=>x.id===paymentId);if(!o||!p)return;if(!confirm(`Excluir o pagamento de ${brl(p.amount)} (${p.method})?`))return;o.payments=o.payments.filter(x=>x.id!==paymentId);updatePaymentStatus(o);save();closeModal();notify('Pagamento excluído.');openOrder(orderId,'costs')}
function addConsumption(id){if(!state.stock.length)return notify('Cadastre produtos no estoque primeiro.');modal('Consumo de produto',`<form id="consForm"><div class="form-grid"><div class="field-group"><label class="label">Produto</label><select id="consProduct" class="select" name="stockId">${opts(state.stock,'')}</select></div><div class="field-group"><label class="label">Quantidade utilizada</label><input class="field" type="number" step=".01" name="qty" required></div></div><button class="btn-green" style="margin-top:14px">Lançar e baixar estoque</button></form>`,'ESTOQUE');$('consForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),s=state.stock.find(x=>x.id===d.stockId),qty=Number(d.qty||0),o=order(id);if(!s)return;o.consumptions.push({id:uid('con'),stockId:s.id,name:s.name,qty,unit:s.unit,cost:qty*Number(s.cost||0)});s.qty=Math.max(0,Number(s.qty||0)-qty);save();closeModal();openOrder(id,'costs')}}
async function photoDB(){return new Promise((res,rej)=>{let r=indexedDB.open('PedroDetailPhotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function putPhoto(rec){let db=await photoDB();return new Promise((res,rej)=>{let t=db.transaction('photos','readwrite');t.objectStore('photos').put(rec);t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function getPhotos(orderId){let db=await photoDB();return new Promise((res,rej)=>{let t=db.transaction('photos','readonly'),r=t.objectStore('photos').getAll();r.onsuccess=()=>res(r.result.filter(x=>x.orderId===orderId));r.onerror=()=>rej(r.error)})}async function delPhoto(id){let db=await photoDB();return new Promise((res,rej)=>{let t=db.transaction('photos','readwrite');t.objectStore('photos').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function compressImage(file){return new Promise((resolve,reject)=>{let url=URL.createObjectURL(file),img=new Image();img.onload=()=>{let max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?resolve(b):reject(new Error('Falha ao processar imagem')),'image/jpeg',.76)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Imagem inválida'))};img.src=url})}
async function loadPhotoGrid(orderId){let g=$('photoGrid');if(!g)return;let photos=await getPhotos(orderId);g.innerHTML=photos.length?photos.map(p=>{let u=URL.createObjectURL(p.blob);return `<div class="photo-card"><img src="${u}"><div class="photo-meta"><b>${esc(p.type)}</b> • ${p.visible?'cliente':'interno'}<br>${fmtDT(p.createdAt)}<div style="margin-top:6px"><button class="btn-danger" data-action="delete-photo" data-photo="${p.id}" data-id="${orderId}">Excluir</button></div></div></div>`}).join(''):'<div class="empty">Nenhuma foto.</div>';let inp=$('photoInput');if(inp)inp.onchange=async e=>{let f=e.target.files?.[0];if(!f)return;notify('Processando foto...');let blob=await compressImage(f);await putPhoto({id:uid('ph'),orderId,type:$('photoType').value,visible:$('photoVisible').value==='true',blob,createdAt:new Date().toISOString(),name:f.name});notify('Foto salva.');loadPhotoGrid(orderId)}}
function printTemplate(id){let t=templates[id],body=t.groups.map(([g,items])=>`<section><h3>${esc(g)}</h3>${items.map(i=>`<div class="pr"><span>□</span>${esc(i)}</div>`).join('')}</section>`).join('');printWin('Checklist '+t.name,`<h1>Pedro Detail</h1><h2>Checklist Interno — ${esc(t.name)}</h2><p>Cliente: ______________________ Placa: __________ Data: ____/____/______</p>${body}`)}
function printOrder(id){let o=order(id),c=client(o.clientId),v=vehicle(o.vehicleId),groups={};(o.steps||[]).forEach(s=>(groups[s.group]??=[]).push(s));let damages=(o.inspection?.damages||[]).map(d=>`<li>${esc(d.location)} — ${esc(d.type)} — ${esc(d.note||'')}</li>`).join('');printWin('Pedro Detail OS',`<h1>Pedro Detail</h1><h2>OS #${String(o.number).padStart(4,'0')} — ${esc(service(o.serviceId)?.name||'')}</h2><p><b>Cliente:</b> ${esc(c?.name||'')} | <b>Veículo:</b> ${esc(v?.model||'')} | <b>Placa:</b> ${esc(v?.plate||'')}</p><p><b>Entrada:</b> KM ${esc(o.inspection?.km||'')} | Combustível ${esc(o.inspection?.fuel||'')}</p><h3>Avarias registradas</h3><ul>${damages||'<li>Nenhuma</li>'}</ul>${Object.entries(groups).map(([g,rows])=>`<section><h3>${esc(g)}</h3>${rows.map(r=>`<div class="pr"><span>${r.done?'✓':'□'}</span>${esc(r.label)}</div>`).join('')}</section>`).join('')}<h3>Controle de qualidade</h3>${(o.quality||[]).map(q=>`<div class="pr"><span>${q.done?'✓':'□'}</span>${esc(q.label)}</div>`).join('')}<p><b>Total:</b> ${brl(totalOrder(o))} | <b>Recebido:</b> ${brl(paidAmount(o))}</p><p><b>Observações:</b> ${esc(o.notes||'—')}</p><h3>Serviço concluído com cuidado e atenção aos detalhes.</h3>`)}
function printWin(t,b){let w=window.open('','_blank');if(!w)return notify('Permita pop-ups.');w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(t)}</title><style>body{font-family:Arial;color:#111;margin:24px}h2{border-bottom:3px solid #111;padding-bottom:8px}section{border:1px solid #bbb;border-radius:8px;padding:10px;margin:10px 0}.pr{display:flex;gap:9px;padding:5px 0;border-top:1px solid #ddd}@media print{body{margin:10mm}}</style><body>${b}<script>window.onload=()=>window.print()<\/script></body>`);w.document.close()}
function exportBackup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pedro-detail-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);notify('Backup exportado.')}function importBackup(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);state={...defaults(),...x};save();notify('Backup importado.');render()}catch{notify('Backup inválido.')}};r.readAsText(f)}
function exportCSV(){let rows=[['OS','Data','Cliente','Veículo','Placa','Serviço','Status','Total','Materiais','Mão de obra','Lucro']];state.orders.forEach(o=>rows.push([o.number,o.date,client(o.clientId)?.name||'',vehicle(o.vehicleId)?.model||'',vehicle(o.vehicleId)?.plate||'',service(o.serviceId)?.name||'',o.status,totalOrder(o),materialCost(o).toFixed(2),laborCost(o).toFixed(2),profitOrder(o).toFixed(2)]));let csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='pedro-detail-relatorio.csv';a.click()}
function globalSearch(q){q=q.toLowerCase().trim();if(!q)return[];let r=[];state.clients.forEach(c=>{if(`${c.name} ${c.phone}`.toLowerCase().includes(q))r.push({t:'Cliente',title:c.name,sub:c.phone||'',action:'open-client',id:c.id})});state.vehicles.forEach(v=>{if(`${v.model} ${v.plate}`.toLowerCase().includes(q))r.push({t:'Veículo',title:v.model,sub:v.plate||'',action:'open-vehicle',id:v.id})});state.orders.forEach(o=>{if(`${o.number} ${client(o.clientId)?.name} ${vehicle(o.vehicleId)?.model} ${vehicle(o.vehicleId)?.plate}`.toLowerCase().includes(q))r.push({t:'OS',title:'OS #'+o.number,sub:client(o.clientId)?.name||'',action:'open-order',id:o.id})});return r.slice(0,20)}
function searchOpen(){$('searchModal').showModal();$('globalSearch').value='';$('searchResults').innerHTML='<div class="hint">Digite para pesquisar.</div>';setTimeout(()=>$('globalSearch').focus(),50)}
function handle(action,t){let id=t.dataset.id;if(action==='close-modal')return closeModal();if(action==='close-search')return $('searchModal').close();if(action==='search')return searchOpen();if(action==='new-client')return openClientForm();if(action==='edit-client')return openClientForm(id);if(action==='open-client')return openClient(id);if(action==='new-vehicle')return openVehicleForm(null,t.dataset.client||'');if(action==='edit-vehicle')return openVehicleForm(id);if(action==='open-vehicle')return openVehicle(id);if(action==='new-appointment')return openAppointment();if(action==='edit-appointment')return openAppointment(id);if(action==='new-order')return openNewOrder();if(action==='open-order')return openOrder(id);if(action==='order-tab')return openOrder(id,t.dataset.tab);if(action==='new-stock')return openStock();if(action==='edit-stock')return openStock(id);if(action==='new-expense')return openExpense();if(action==='edit-finance-metric')return openFinanceMetric(t.dataset.field);if(action==='reset-finance-metric')return resetFinanceMetric(t.dataset.field);if(action==='new-employee')return openEmployee();if(action==='edit-employee')return openEmployee(id);if(action==='new-equipment')return openEquipment();if(action==='edit-equipment')return openEquipment(id);if(action==='new-plan')return openPlan();if(action==='edit-plan')return openPlan(id);if(action==='new-coupon')return openCoupon();if(action==='edit-coupon')return openCoupon(id);if(action==='new-subscription')return openSubscription(t.dataset.client||'');if(action==='edit-subscription')return openSubscription('',id);if(action==='preview-template')return previewTemplate(id);if(action==='print-template')return printTemplate(id);if(action==='print-order')return printOrder(id);if(action==='backup-export')return exportBackup();if(action==='export-csv')return exportCSV();if(action==='print-report')return printWin('Relatório Pedro Detail',$('view').innerHTML);if(action==='add-damage')return addDamage(id);if(action==='signature')return openSignature(id);if(action==='add-addon')return addAddon(id);if(action==='add-payment')return addPayment(id);if(action==='edit-payment')return editPayment(id,t.dataset.payment);if(action==='delete-payment')return deletePayment(id,t.dataset.payment);if(action==='add-consumption')return addConsumption(id);
if(action==='save-order-summary'){let o=order(id);o.status=$('oStatus').value;o.employeeId=$('oEmployee').value;o.expectedAt=$('oExpected').value;o.warrantyMonths=Number($('oWarranty').value||0);o.notes=$('oNotes').value;save();notify('OS atualizada.');return openOrder(id,'summary')}if(action==='timer-toggle'){let o=order(id);o.timer=o.timer||{elapsed:0,startedAt:null};if(o.timer.startedAt){o.timer.elapsed=Number(o.timer.elapsed||0)+(Date.now()-o.timer.startedAt);o.timer.startedAt=null}else o.timer.startedAt=Date.now();save();return openOrder(id,'summary')}if(action==='timer-reset'){let o=order(id);o.timer={elapsed:0,startedAt:null};save();return openOrder(id,'summary')}if(action==='save-inspection'){let o=order(id);o.inspection.km=$('inKm').value;o.inspection.fuel=$('inFuel').value;o.inspection.belongings=$('inBelongings').value;o.inspection.notes=$('inNotes').value;let v=vehicle(o.vehicleId);if(v)v.km=o.inspection.km;save();notify('Entrada salva.');return openOrder(id,'inspection')}if(action==='delete-damage'){let o=order(id);o.inspection.damages=o.inspection.damages.filter(d=>d.id!==t.dataset.damage);save();return openOrder(id,'inspection')}if(action==='clear-signature'){let c=$('signCanvas');c.getContext('2d').clearRect(0,0,c.width,c.height);return}if(action==='save-signature'){let o=order(id);o.inspection.signature=$('signCanvas').toDataURL('image/jpeg',.5);save();closeModal();notify('Assinatura salva.');return openOrder(id,'inspection')}if(action==='addon-status'){let o=order(id),a=o.addons.find(x=>x.id===t.dataset.addon);a.status=t.dataset.status;save();return openOrder(id,'costs')}if(action==='save-other-cost'){order(id).otherCost=Number($('otherCost').value||0);save();return openOrder(id,'costs')}if(action==='save-review'){let rating=Number($('reviewRating').value||0);if(!rating)return notify('Escolha uma nota.');let o=order(id),r={id:uid('rev'),orderId:id,clientId:o.clientId,rating,comment:$('reviewComment').value,date:new Date().toISOString()};state.reviews.push(r);o.reviewId=r.id;save();notify('Avaliação registrada.');return openOrder(id,'quality')}if(action==='finish-order'){let o=order(id);if(qualityProgress(o)<100&&!confirm('O controle de qualidade não está 100%. Entregar mesmo assim?'))return;o.status='entregue';if(o.timer?.startedAt){o.timer.elapsed+=Date.now()-o.timer.startedAt;o.timer.startedAt=null}let c=client(o.clientId);if(c)c.points=Number(c.points||0)+Math.max(1,Math.floor(totalOrder(o)/50));save();notify('Veículo entregue.');closeModal();return render()}if(action==='delete-photo'){delPhoto(t.dataset.photo).then(()=>loadPhotoGrid(id));return}
if(action==='save-settings'){state.settings.business=$('setBusiness').value;state.settings.whatsapp=$('setWhats').value;state.settings.address=$('setAddress').value;state.settings.laborDefault=Number($('setLabor').value||0);document.querySelectorAll('.service-price').forEach(x=>service(x.dataset.id).price=Number(x.value||0));document.querySelectorAll('.service-duration').forEach(x=>service(x.dataset.id).duration=Number(x.value||0));document.querySelectorAll('.service-active').forEach(x=>service(x.dataset.id).active=x.checked);save();notify('Configurações salvas.');return render()}
if(action==='delete-client'&&confirm('Excluir cliente?')){state.clients=state.clients.filter(x=>x.id!==id);save();closeModal();return render()}if(action==='delete-vehicle'&&confirm('Excluir veículo?')){state.vehicles=state.vehicles.filter(x=>x.id!==id);save();closeModal();return render()}if(action==='delete-stock'&&confirm('Excluir produto?')){state.stock=state.stock.filter(x=>x.id!==id);save();closeModal();return render()}if(action==='delete-expense'&&confirm('Excluir despesa?')){state.expenses=state.expenses.filter(x=>x.id!==id);save();return render()}if(action==='delete-appointment'&&confirm('Excluir agendamento?')){state.appointments=state.appointments.filter(x=>x.id!==id);save();closeModal();return render()}if(action==='delete-order'&&confirm('Excluir OS?')){state.orders=state.orders.filter(x=>x.id!==id);save();closeModal();return render()}if(action==='reset'&&confirm('Apagar todos os dados deste aparelho?')){localStorage.removeItem(STORAGE_KEY);state=defaults();save();notify('Dados apagados.');return render()}}
document.addEventListener('click',e=>{let r=e.target.closest('[data-route]');if(r)return setRoute(r.dataset.route);let a=e.target.closest('[data-action]');if(a)handle(a.dataset.action,a)});document.addEventListener('change',e=>{let t=e.target;if(t.dataset.action==='toggle-step'){let o=order(t.dataset.id),n=Number(t.dataset.step);o.steps[n].done=t.checked;if(t.checked&&o.status==='recebido')o.status='em_andamento';save();openOrder(o.id,'process')}if(t.dataset.action==='toggle-quality'){let o=order(t.dataset.id),n=Number(t.dataset.step);o.quality[n].done=t.checked;if(qualityProgress(o)===100)o.status='pronto';else if(o.status==='pronto')o.status='qualidade';save();openOrder(o.id,'quality')}});$('globalSearch').addEventListener('input',e=>{let r=globalSearch(e.target.value);$('searchResults').innerHTML=r.length?r.map(x=>`<button class="module-card full" style="margin-bottom:7px" data-action="${x.action}" data-id="${x.id}"><b>${esc(x.title)}</b><small class="hint">${esc(x.t)} • ${esc(x.sub)}</small></button>`).join(''):'<div class="empty">Nenhum resultado.</div>'});window.addEventListener('hashchange',()=>{route=location.hash.replace('#/','')||'dashboard';render()});render();
</script>
</body></html>
