function paidAmount(o){return (o.payments||[]).reduce((a,p)=>a+Number(p.amount||0),0)}function paymentStatusKey(o){let paid=paidAmount(o),total=totalOrder(o);if(paid<=0)return 'pendente';if(total<=0||paid+0.005>=total)return 'pago';return 'parcial'}function updatePaymentStatus(o){o.paymentStatus=paymentStatusKey(o);return o.paymentStatus}function orderProgress(o){let a=o.steps||[];if(!a.length)return 0;return Math.round(a.filter(x=>x.done).length/a.length*100)}function qualityProgress(o){let a=o.quality||[];return a.length?Math.round(a.filter(x=>x.done).length/a.length*100):0}function currentTimer(o){let ms=Number(o.timer?.elapsed||0);if(o.timer?.startedAt)ms+=Date.now()-o.timer.startedAt;return ms}function humanTime(ms){let m=Math.floor(ms/60000),h=Math.floor(m/60);m%=60;return `${h}h ${String(m).padStart(2,'0')}min`}function materialCost(o){return (o.consumptions||[]).reduce((a,c)=>a+Number(c.cost||0),0)}function laborCost(o){let emp=employee(o.employeeId),rate=Number(emp?.hourlyCost||state.settings.laborDefault||0);return currentTimer(o)/3600000*rate}function totalOrder(o){return Number(o.price||0)+(o.addons||[]).filter(x=>x.status==='approved').reduce((a,x)=>a+Number(x.price||0),0)-Number(o.discount||0)}function profitOrder(o){return totalOrder(o)-materialCost(o)-laborCost(o)-Number(o.otherCost||0)}function badgeStatus(s){let cls={aguardando:'warn',recebido:'warn',em_andamento:'green',qualidade:'pink',pronto:'green',entregue:'green',cancelado:'red'}[s]||'';return `<span class="badge ${cls}">${statusLabels[s]||s}</span>`}

async function pdRpc(name,body){
  let r=await fetch(`${PD_SUPABASE_URL}/rest/v1/rpc/${name}`,{
    method:'POST',headers:{apikey:PD_SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)
  });
  if(!r.ok)throw new Error(await r.text());
  let t=await r.text();return t?JSON.parse(t):null
}
function ensurePortal(o){

  if(o.portal.showPrice===undefined)o.portal.showPrice=true;

}
function cleanGroupName(g){
  let map={'RODAS E CAIXAS DE RODA':'Preparação','LAVAGEM EXTERNA':'Lavagem externa','DESCONTAMINAÇÃO E PROTEÇÃO':'Tratamentos e proteção','SECAGEM':'Secagem','LIMPEZA INTERNA':'Interior','FINALIZAÇÃO':'Finalização','PREPARAÇÃO':'Preparação','CORREÇÃO':'Correção da pintura','PROTEÇÃO':'Proteção','POLIMENTO':'Polimento','INSPEÇÃO':'Inspeção técnica','HIGIENIZAÇÃO':'Higienização','TRATAMENTO':'Tratamento','LIMPEZA':'Limpeza'};
  return map[g]||String(g||'Etapa').toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase())
}
function portalStages(o){
  let groups=[...new Set((o.steps||[]).map(s=>s.group))],out=[];
  out.push({key:'received',name:'Veículo recebido',state:o.status==='aguardando'?'current':'done'});
  for(let g of groups){
    let rows=(o.steps||[]).filter(s=>s.group===g),done=rows.length&&rows.every(s=>s.done),some=rows.some(s=>s.done);
    out.push({key:'g_'+g,name:cleanGroupName(g),state:done?'done':(some&&o.status==='em_andamento'?'current':'pending')});
  }
  let q=qualityProgress(o),qDone=['pronto','entregue'].includes(o.status)||q===100,qCurrent=o.status==='qualidade'||(!qDone&&q>0);
  out.push({key:'quality',name:'Controle de qualidade',state:qDone?'done':qCurrent?'current':'pending'});
  out.push({key:'ready',name:'Pronto para entrega',state:o.status==='entregue'?'done':o.status==='pronto'?'current':'pending'});
  if(o.status==='em_andamento'&&!out.some(x=>x.state==='current')){let first=out.find(x=>x.state==='pending');if(first)first.state='current'}
  return out.map((x,i)=>({...x,sort:i}))
}
function portalProgress(o){
  if(o.status==='aguardando')return 0;
  if(o.status==='recebido')return 5;
  if(o.status==='em_andamento')return Math.min(88,10+Math.round(orderProgress(o)*.78));
  if(o.status==='qualidade')return Math.min(98,90+Math.round(qualityProgress(o)*.08));
  if(['pronto','entregue'].includes(o.status))return 100;
  return orderProgress(o)
}
function portalStatusLabel(o){return {aguardando:'Aguardando atendimento',recebido:'Veículo recebido',em_andamento:'Em atendimento',qualidade:'Controle de qualidade',pronto:'Pronto para retirada',entregue:'Serviço concluído',cancelado:'Atendimento encerrado'}[o.status]||statusLabels[o.status]||o.status}
async function portalPhotoDataUrl(blob){
  return new Promise((resolve,reject)=>{
    let url=URL.createObjectURL(blob),img=new Image();
    img.onload=()=>{let max=900,sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.58))};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('foto'))};img.src=url
  })
}
async function portalPayload(o){

async function syncPortalOrder(o,{silent=false}={}){
  let p=ensurePortal(o),key=portalKey();if(!p.active||!key)return null;

  if(res?.token)p.token=res.token;p.lastSync=new Date().toISOString();
  for(let rr of (res?.remote_addons||[])){let a=(o.addons||[]).find(x=>x.id===rr.id);if(a&&a.status!==rr.status){a.status=rr.status;if(!silent)notify(rr.status==='approved'?'✅ Cliente aprovou o adicional':'Cliente recusou o adicional')}}

  let localReview=state.reviews.find(x=>x.id===o.reviewId);
  if(localReview&&!res?.review){
    try{await pdRpc('admin_set_tracking_review',{p_admin_key:key,p_local_order_id:o.id,p_rating:Number(localReview.rating),p_comment:localReview.comment||''});p.review={rating:Number(localReview.rating),comment:localReview.comment||'',created_at:localReview.date||new Date().toISOString()}}catch{}

  return res
}

function clientForm(c={}){return `<form id="clientForm"><div class="form-grid"><div class="field-group"><label class="label">Nome *</label><input class="field" name="name" required value="${esc(c.name||'')}"></div><div class="field-group"><label class="label">WhatsApp</label><input class="field" name="phone" value="${esc(c.phone||'')}"></div><div class="field-group"><label class="label">E-mail</label><input class="field" name="email" value="${esc(c.email||'')}"></div><div class="field-group"><label class="label">Pontos</label><input class="field" type="number" name="points" value="${Number(c.points||0)}"></div><div class="field-group wide"><label class="label">Observações</label><textarea class="textarea" name="notes">${esc(c.notes||'')}</textarea></div></div><div class="form-actions" style="margin-top:15px"><button class="btn-green">Salvar</button></div></form>`}

function openClient(id){let c=client(id);if(!c)return;let vs=state.vehicles.filter(v=>v.clientId===id),os=state.orders.filter(o=>o.clientId===id).sort((a,b)=>b.number-a.number),sub=state.subscriptions.find(s=>s.clientId===id);modal(c.name,`<div class="grid cols-3"><div class="card soft"><div class="metric-label">PONTOS</div><div class="metric-value">${c.points||0}</div></div><div class="card soft"><div class="metric-label">VEÍCULOS</div><div class="metric-value">${vs.length}</div></div><div class="card soft"><div class="metric-label">SERVIÇOS</div><div class="metric-value">${os.length}</div></div></div><div class="separator"></div><div class="form-actions"><button class="btn-green" data-action="edit-client" data-id="${c.id}">Editar cadastro</button><button class="btn-ghost" data-action="new-vehicle" data-client="${c.id}">+ Veículo</button><button class="btn-ghost" data-action="new-subscription" data-client="${c.id}">Plano</button><button class="btn-danger" data-action="delete-client" data-id="${c.id}">Excluir</button></div><div class="section"><h3>Histórico</h3>${os.length?os.map(o=>`<div class="kpi-line"><div><b>OS #${String(o.number).padStart(4,'0')} • ${esc(service(o.serviceId)?.name||'')}</b><div class="hint">${fmt(o.date)} • ${esc(vehicle(o.vehicleId)?.model||'')}</div></div><button class="btn-ghost" data-action="open-order" data-id="${o.id}">Abrir</button></div>`).join(''):'<div class="empty">Sem serviços ainda.</div>'}</div>${sub?`<div class="section card soft"><b>Plano ativo: ${esc(state.plans.find(p=>p.id===sub.planId)?.name||'')}</b><div class="hint">Vence em ${fmt(sub.expiresAt)}</div></div>`:''}`,'CLIENTE') }
function vehicleForm(v={},clientId=''){return `<form id="vehicleForm"><div class="form-grid"><div class="field-group"><label class="label">Cliente *</label><select class="select" name="clientId" required>${opts(state.clients,v.clientId||clientId)}</select></div><div class="field-group"><label class="label">Veículo *</label><input class="field" name="model" required value="${esc(v.model||'')}"></div><div class="field-group"><label class="label">Placa</label><input class="field" name="plate" value="${esc(v.plate||'')}"></div><div class="field-group"><label class="label">Cor</label><input class="field" name="color" value="${esc(v.color||'')}"></div><div class="field-group"><label class="label">Ano</label><input class="field" name="year" value="${esc(v.year||'')}"></div><div class="field-group"><label class="label">KM atual</label><input class="field" name="km" value="${esc(v.km||'')}"></div><div class="field-group"><label class="label">Próximo cuidado</label><input class="field" name="nextCareDate" type="date" value="${esc(v.nextCareDate||'')}"></div><div class="field-group wide"><label class="label">Recomendação</label><textarea class="textarea" name="maintenanceNote">${esc(v.maintenanceNote||'')}</textarea></div></div><div class="form-actions" style="margin-top:15px"><button class="btn-green">Salvar</button></div></form>`}
function openVehicleForm(id,clientId=''){if(!state.clients.length)return notify('Cadastre um cliente primeiro.');let v=id?vehicle(id):{};modal(id?'Editar veículo':'Novo veículo',vehicleForm(v,clientId),'VEÍCULOS');$('vehicleForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.plate=(d.plate||'').toUpperCase();if(id)Object.assign(v,d);else state.vehicles.push({id:uid('vei'),...d,createdAt:new Date().toISOString()});save();closeModal();notify('Veículo salvo.');render()}}
function openVehicle(id){let v=vehicle(id);if(!v)return;let os=state.orders.filter(o=>o.vehicleId===id).sort((a,b)=>b.number-a.number);modal(v.model,`<div class="grid cols-2"><div class="card soft"><div class="metric-label">PLACA</div><h2 style="margin-top:7px">${esc(v.plate||'—')}</h2><div class="hint">${esc(client(v.clientId)?.name||'')}</div></div><div class="card soft"><div class="metric-label">PRÓXIMO CUIDADO</div><h2 style="margin-top:7px">${fmt(v.nextCareDate)}</h2><div class="hint">${esc(v.maintenanceNote||'Sem recomendação')}</div></div></div><div class="form-actions section"><button class="btn-green" data-action="edit-vehicle" data-id="${v.id}">Editar</button><button class="btn-danger" data-action="delete-vehicle" data-id="${v.id}">Excluir</button></div><div class="section"><h3>Histórico pela placa</h3>${os.length?os.map(o=>`<div class="kpi-line"><div><b>${fmt(o.date)} • ${esc(service(o.serviceId)?.name||'')}</b><div class="hint">OS #${o.number} • ${brl(totalOrder(o))}</div></div><button class="btn-ghost" data-action="open-order" data-id="${o.id}">Abrir</button></div>`).join(''):'<div class="empty">Sem histórico.</div>'}</div>`,'VEÍCULO')}
function appointmentForm(a={}){return `<form id="appointmentForm"><div class="form-grid"><div class="field-group"><label class="label">Cliente</label><select id="apptClient" class="select" name="clientId">${opts(state.clients,a.clientId)}</select></div><div class="field-group"><label class="label">Veículo</label><select id="apptVehicle" class="select" name="vehicleId">${opts(state.vehicles.filter(v=>v.clientId===(a.clientId||state.clients[0]?.id)),a.vehicleId,x=>x.model+' • '+(x.plate||''))}</select></div><div class="field-group"><label class="label">Serviço</label><select class="select" name="serviceId">${opts(state.services.filter(s=>s.active!==false),a.serviceId)}</select></div><div class="field-group"><label class="label">Data e hora</label><input class="field" type="datetime-local" name="date" required value="${a.date?new Date(a.date).toISOString().slice(0,16):''}"></div><div class="field-group"><label class="label">Status</label><select class="select" name="status"><option value="agendado">Agendado</option><option value="confirmado" ${a.status==='confirmado'?'selected':''}>Confirmado</option><option value="concluido" ${a.status==='concluido'?'selected':''}>Concluído</option></select></div><div class="field-group wide"><label class="label">Observações</label><textarea class="textarea" name="notes">${esc(a.notes||'')}</textarea></div></div><div class="form-actions" style="margin-top:15px"><button class="btn-green">Salvar</button>${a.id?`<button type="button" class="btn-danger" data-action="delete-appointment" data-id="${a.id}">Excluir</button>`:''}</div></form>`}
function openAppointment(id){if(!state.clients.length)return notify('Cadastre um cliente primeiro.');let a=id?state.appointments.find(x=>x.id===id):{};modal(id?'Editar agendamento':'Novo agendamento',appointmentForm(a),'AGENDA');$('apptClient').onchange=e=>$('apptVehicle').innerHTML=opts(state.vehicles.filter(v=>v.clientId===e.target.value),'',x=>x.model+' • '+(x.plate||''));$('appointmentForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.date=new Date(d.date).toISOString();if(id)Object.assign(a,d);else state.appointments.push({id:uid('ag'),...d,createdAt:new Date().toISOString()});save();closeModal();notify('Agendamento salvo.');render()}}
function orderForm(){let c=state.clients[0],v=state.vehicles.find(x=>x.clientId===c?.id),s=state.services.find(x=>x.active!==false);return `<form id="orderForm"><div class="form-grid"><div class="field-group"><label class="label">Cliente</label><select id="orderClient" class="select" name="clientId">${opts(state.clients,c?.id)}</select></div><div class="field-group"><label class="label">Veículo</label><select id="orderVehicle" class="select" name="vehicleId">${opts(state.vehicles.filter(x=>x.clientId===c?.id),v?.id,x=>x.model+' • '+(x.plate||''))}</select></div><div class="field-group"><label class="label">Serviço</label><select id="orderService" class="select" name="serviceId">${opts(state.services.filter(x=>x.active!==false),s?.id)}</select></div><div class="field-group"><label class="label">Responsável</label><select class="select" name="employeeId"><option value="">Não definido</option>${opts(state.employees.filter(e=>e.active!==false),'')}</select></div><div class="field-group"><label class="label">Data</label><input class="field" type="date" name="date" value="${today()}"></div><div class="field-group"><label class="label">Previsão de entrega</label><input class="field" type="datetime-local" name="expectedAt"></div><div class="field-group"><label class="label">Valor base</label><input id="orderPrice" class="field" type="number" step=".01" name="price" value="${s?.price||0}"></div><div class="field-group"><label class="label">Cupom</label><select class="select" name="couponId"><option value="">Sem cupom</option>${opts(state.coupons.filter(c=>c.active),'',x=>x.code)}</select></div><div class="field-group wide"><label class="label">Observações</label><textarea class="textarea" name="notes"></textarea></div></div><div class="form-actions" style="margin-top:15px"><button class="btn-green">Criar OS e fazer entrada</button></div></form>`}
function openNewOrder(){if(!state.clients.length)return openClientForm();if(!state.vehicles.length)return openVehicleForm();modal('Nova ordem de serviço',orderForm(),'ORDENS DE SERVIÇO');$('orderClient').onchange=e=>$('orderVehicle').innerHTML=opts(state.vehicles.filter(v=>v.clientId===e.target.value),'',x=>x.model+' • '+(x.plate||''));$('orderService').onchange=e=>{let s=service(e.target.value);$('orderPrice').value=s?.price||0};$('orderForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),s=service(d.serviceId),coupon=state.coupons.find(c=>c.id===d.couponId),discount=0;if(coupon)discount=coupon.type==='percent'?Number(d.price||0)*Number(coupon.value||0)/100:Number(coupon.value||0);let num=state.settings.nextOrder||1;state.settings.nextOrder=num+1;let o={id:uid('os'),number:num,...d,price:Number(d.price||0),discount,status:'recebido',paymentStatus:'pendente',createdAt:new Date().toISOString(),steps:cloneSteps(s?.template),quality:qualitySteps.map(label=>({label,done:false})),inspection:{km:vehicle(d.vehicleId)?.km||'',fuel:'',belongings:'',notes:'',damages:[],signature:''},addons:[],payments:[],consumptions:[],timer:{elapsed:0,startedAt:null},warrantyMonths:0,otherCost:0,publicCode:Math.random().toString(36).slice(2,8).toUpperCase()};state.orders.push(o);save();closeModal();notify('OS criada. Faça a inspeção de entrada.');openOrder(o.id)}}
function orderTabs(o,tab){return `<div class="tabs">${[['summary','Resumo'],['inspection','Entrada / Avarias'],['process','Checklist'],['photos','Fotos'],['costs','Custos / Pagamentos'],['client','Cliente'],['quality','Qualidade / Entrega']].map(x=>`<button class="tab ${tab===x[0]?'active':''}" data-action="order-tab" data-id="${o.id}" data-tab="${x[0]}">${x[1]}</button>`).join('')}</div>`}

function orderSummary(o){let p=orderProgress(o);return `<div class="grid cols-3"><div class="card soft"><div class="metric-label">CLIENTE</div><h3 style="margin-top:7px">${esc(client(o.clientId)?.name||'—')}</h3><div class="hint">${esc(vehicle(o.vehicleId)?.model||'')} • ${esc(vehicle(o.vehicleId)?.plate||'')}</div></div><div class="card soft"><div class="metric-label">SERVIÇO</div><h3 style="margin-top:7px">${esc(service(o.serviceId)?.name||'—')}</h3><div class="hint">${brl(totalOrder(o))} • ${fmt(o.date)}</div></div><div class="card soft"><div class="metric-label">RESPONSÁVEL</div><h3 style="margin-top:7px">${esc(employee(o.employeeId)?.name||'Não definido')}</h3><div class="hint">${humanTime(currentTimer(o))}</div></div></div><div class="section"><div class="progress"><span style="width:${p}%"></span></div><div class="progress-label"><span>Execução</span><b>${p}%</b></div></div><div class="section form-grid"><div class="field-group"><label class="label">Status</label><select id="oStatus" class="select">${Object.entries(statusLabels).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field-group"><label class="label">Responsável</label><select id="oEmployee" class="select"><option value="">Não definido</option>${opts(state.employees,o.employeeId)}</select></div><div class="field-group"><label class="label">Previsão</label><input id="oExpected" class="field" type="datetime-local" value="${o.expectedAt?o.expectedAt.slice(0,16):''}"></div><div class="field-group"><label class="label">Garantia (meses)</label><input id="oWarranty" class="field" type="number" value="${o.warrantyMonths||0}"></div><div class="field-group wide"><label class="label">Observações</label><textarea id="oNotes" class="textarea">${esc(o.notes||'')}</textarea></div></div><div class="section card soft"><div class="section-head"><div><h3>Cronômetro do serviço</h3><div class="hint">Tempo real usado para produtividade e custo.</div></div><b style="font-size:24px">${humanTime(currentTimer(o))}</b></div><div class="form-actions"><button class="${o.timer?.startedAt?'btn-pink':'btn-green'}" data-action="timer-toggle" data-id="${o.id}">${o.timer?.startedAt?'Pausar':'Iniciar'} cronômetro</button><button class="btn-ghost" data-action="timer-reset" data-id="${o.id}">Zerar</button></div></div><div class="form-actions section"><button class="btn-green" data-action="save-order-summary" data-id="${o.id}">Salvar alterações</button><button class="btn-ghost" data-action="print-order" data-id="${o.id}">Relatório / PDF</button><button class="btn-danger" data-action="delete-order" data-id="${o.id}">Excluir OS</button></div>`}

function orderInspection(o){let i=o.inspection||{};return `<div class="grid cols-2"><div><div class="form-grid"><div class="field-group"><label class="label">KM entrada</label><input id="inKm" class="field" value="${esc(i.km||'')}"></div><div class="field-group"><label class="label">Combustível</label><select id="inFuel" class="select">${['Reserva','1/4','1/2','3/4','Cheio'].map(x=>`<option ${i.fuel===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field-group wide"><label class="label">Objetos / pertences</label><textarea id="inBelongings" class="textarea">${esc(i.belongings||'')}</textarea></div><div class="field-group wide"><label class="label">Observações de entrada</label><textarea id="inNotes" class="textarea">${esc(i.notes||'')}</textarea></div></div><div class="form-actions" style="margin-top:12px"><button class="btn-green" data-action="save-inspection" data-id="${o.id}">Salvar entrada</button><button class="btn-ghost" data-action="signature" data-id="${o.id}">${i.signature?'Refazer assinatura':'Coletar assinatura'}</button></div>${i.signature?'<div class="hint" style="margin-top:8px">✓ Assinatura registrada</div>':''}</div><div><div class="car-map">${carSVG()}</div><div class="form-actions" style="margin-top:10px"><button class="btn-pink" data-action="add-damage" data-id="${o.id}">+ Marcar avaria</button></div><div class="section">${(i.damages||[]).map(d=>`<span class="damage-chip">${esc(d.location)} • ${esc(d.type)} <button style="border:0;background:none;color:#fff" data-action="delete-damage" data-id="${o.id}" data-damage="${d.id}">×</button></span>`).join('')||'<div class="hint">Nenhuma avaria registrada.</div>'}</div></div></div>`}
function orderProcess(o){let grouped={};(o.steps||[]).forEach((s,n)=>(grouped[s.group]??=[]).push([s,n]));return `<div class="section-head"><div><h3>Checklist operacional</h3><p class="section-sub">Marque cada etapa conforme executar.</p></div><span class="badge green">${orderProgress(o)}%</span></div>${Object.entries(grouped).map(([g,rows])=>`<div class="check-group"><div class="check-title">${esc(g)}</div>${rows.map(([s,n])=>`<div class="check-row ${s.done?'done':''}"><input type="checkbox" data-action="toggle-step" data-id="${o.id}" data-step="${n}" ${s.done?'checked':''}><label>${esc(s.label)}</label></div>`).join('')}</div>`).join('')}`}

function openFinanceMetric(field){let month=today().slice(0,7),labels={received:'Recebido',receivable:'A receber',expenses:'Despesas',result:'Resultado estimado'},orders=state.orders.filter(o=>(o.date||'').slice(0,7)===month&&!['cancelado'].includes(o.status)),rev=orders.reduce((a,o)=>a+paidAmount(o),0),expected=orders.reduce((a,o)=>a+totalOrder(o),0),expenses=state.expenses.filter(e=>(e.date||'').slice(0,7)===month).reduce((a,e)=>a+Number(e.amount||0),0),materials=orders.reduce((a,o)=>a+materialCost(o),0),labor=orders.reduce((a,o)=>a+laborCost(o),0),auto={received:rev,receivable:Math.max(0,expected-rev),expenses:expenses,result:expected-expenses-materials-labor},ov=(state.financeOverrides||{})[month]||{},current=ov[field]===undefined?auto[field]:ov[field];modal('Editar '+labels[field],`<form id="financeMetricForm"><div class="field-group"><label class="label">Valor exibido</label><input id="financeMetricValue" class="field" type="number" step="0.01" inputmode="decimal" value="${Number(current||0)}" required></div><div class="card soft" style="margin-top:12px"><div class="hint">Cálculo automático atual</div><b style="font-size:22px">${brl(auto[field])}</b><div class="hint" style="margin-top:8px">Ao salvar, este card passa a usar um valor manual neste mês. Isso não altera as OS, pagamentos ou despesas lançadas.</div></div><div class="form-actions" style="margin-top:15px"><button class="btn-green" type="submit">Salvar valor</button><button class="btn-ghost" type="button" data-action="reset-finance-metric" data-field="${field}">Usar automático</button></div></form>`,'FINANCEIRO');$('financeMetricForm').onsubmit=e=>{e.preventDefault();state.financeOverrides=state.financeOverrides||{};state.financeOverrides[month]=state.financeOverrides[month]||{};state.financeOverrides[month][field]=Number($('financeMetricValue').value||0);save();closeModal();notify('Valor financeiro atualizado.');render()}}

function addPayment(id){modal('Registrar pagamento',`<form id="paymentForm"><div class="form-grid"><div class="field-group"><label class="label">Valor</label><input class="field" type="number" step=".01" min="0.01" inputmode="decimal" name="amount" required></div><div class="field-group"><label class="label">Forma</label><select class="select" name="method"><option>Pix</option><option>Dinheiro</option><option>Cartão débito</option><option>Cartão crédito</option><option>Outro</option></select></div><div class="field-group"><label class="label">Data</label><input class="field" type="date" name="date" value="${today()}"></div></div><div class="hint" style="margin-top:10px">Antes de registrar, confira se este pagamento já não foi lançado.</div><button class="btn-green" style="margin-top:14px">Registrar</button></form>`,'PAGAMENTO');$('paymentForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),o=order(id);d.amount=Number(d.amount||0);let duplicate=(o.payments||[]).some(p=>Number(p.amount||0)===d.amount&&p.method===d.method&&p.date===d.date);if(duplicate&&!confirm('Já existe um pagamento com o mesmo valor, forma e data nesta OS. Deseja registrar mesmo assim?'))return;o.payments.push({id:uid('pay'),...d});updatePaymentStatus(o);save();closeModal();openOrder(id,'costs')}}
function editPayment(orderId,paymentId){let o=order(orderId),p=(o?.payments||[]).find(x=>x.id===paymentId);if(!o||!p)return;let methods=['Pix','Dinheiro','Cartão débito','Cartão crédito','Outro'];modal('Editar pagamento',`<form id="paymentEditForm"><div class="form-grid"><div class="field-group"><label class="label">Valor recebido</label><input class="field" type="number" step=".01" min="0.01" inputmode="decimal" name="amount" value="${Number(p.amount||0)}" required></div><div class="field-group"><label class="label">Forma de pagamento</label><select class="select" name="method">${methods.map(m=>`<option ${p.method===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="field-group"><label class="label">Data</label><input class="field" type="date" name="date" value="${p.date||today()}"></div></div><div class="form-actions" style="margin-top:14px"><button class="btn-green" type="submit">Salvar alterações</button><button class="btn-danger" type="button" data-action="delete-payment" data-id="${orderId}" data-payment="${paymentId}">Excluir pagamento</button></div></form>`,'PAGAMENTO');$('paymentEditForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));p.amount=Number(d.amount||0);p.method=d.method;p.date=d.date;updatePaymentStatus(o);save();closeModal();notify('Pagamento atualizado.');openOrder(orderId,'costs')}}
function deletePayment(orderId,paymentId){let o=order(orderId),p=(o?.payments||[]).find(x=>x.id===paymentId);if(!o||!p)return;if(!confirm(`Excluir o pagamento de ${brl(p.amount)} (${p.method})?`))return;o.payments=o.payments.filter(x=>x.id!==paymentId);updatePaymentStatus(o);save();closeModal();notify('Pagamento excluído.');openOrder(orderId,'costs')}
function addConsumption(id){if(!state.stock.length)return notify('Cadastre produtos no estoque primeiro.');modal('Consumo de produto',`<form id="consForm"><div class="form-grid"><div class="field-group"><label class="label">Produto</label><select id="consProduct" class="select" name="stockId">${opts(state.stock,'')}</select></div><div class="field-group"><label class="label">Quantidade utilizada</label><input class="field" type="number" step=".01" name="qty" required></div></div><button class="btn-green" style="margin-top:14px">Lançar e baixar estoque</button></form>`,'ESTOQUE');$('consForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),s=state.stock.find(x=>x.id===d.stockId),qty=Number(d.qty||0),o=order(id);if(!s)return;o.consumptions.push({id:uid('con'),stockId:s.id,name:s.name,qty,unit:s.unit,cost:qty*Number(s.cost||0)});s.qty=Math.max(0,Number(s.qty||0)-qty);save();closeModal();openOrder(id,'costs')}}
async function photoDB(){return new Promise((res,rej)=>{let r=indexedDB.open('PedroDetailPhotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function putPhoto(rec){let db=await photoDB();return new Promise((res,rej)=>{let t=db.transaction('photos','readwrite');t.objectStore('photos').put(rec);t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function getPhotos(orderId){let db=await photoDB();return new Promise((res,rej)=>{let t=db.transaction('photos','readonly'),r=t.objectStore('photos').getAll();r.onsuccess=()=>res(r.result.filter(x=>x.orderId===orderId));r.onerror=()=>rej(r.error)})}async function delPhoto(id){let db=await photoDB();return new Promise((res,rej)=>{let t=db.transaction('photos','readwrite');t.objectStore('photos').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function compressImage(file){return new Promise((resolve,reject)=>{let url=URL.createObjectURL(file),img=new Image();img.onload=()=>{let max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?resolve(b):reject(new Error('Falha ao processar imagem')),'image/jpeg',.76)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Imagem inválida'))};img.src=url})}
async function loadPhotoGrid(orderId){let g=$('photoGrid');if(!g)return;let photos=(await getPhotos(orderId)).filter(p=>!p.addonId);g.innerHTML=photos.length?photos.map(p=>{let u=URL.createObjectURL(p.blob);return `<div class="photo-card"><img src="${u}"><div class="photo-meta"><b>${esc(p.type)}</b> • ${p.visible?'cliente':'interno'}<br>${fmtDT(p.createdAt)}<div style="margin-top:6px"><button class="btn-danger" data-action="delete-photo" data-photo="${p.id}" data-id="${orderId}">Excluir</button></div></div></div>`}).join(''):'<div class="empty">Nenhuma foto.</div>';

  const saveOsPhotos=async(files)=>{
    files=Array.from(files||[]).filter(f=>f&&String(f.type||'').startsWith('image/'));
    if(!files.length)return;
    let type=$('photoType')?.value||'processo',visible=$('photoVisible')?.value==='true';
    notify(files.length>1?`Processando ${files.length} fotos...`:'Processando foto...');
    let saved=0;
    for(const f of files){
      try{
        let blob=await compressImage(f);
        await putPhoto({id:uid('ph'),orderId,type,visible,blob,createdAt:new Date().toISOString(),name:f.name||'foto.jpg'});
        saved++;
      }catch(err){console.error('Erro ao salvar foto da OS',err)}
    }
    notify(saved===1?'Foto salva.':`${saved} fotos salvas.`);
    await loadPhotoGrid(orderId);
    schedulePortalSyncAll();
  };

  let camera=$('photoCameraInput');
  if(camera)camera.onchange=async e=>{await saveOsPhotos(e.target.files);e.target.value=''};
  let gallery=$('photoGalleryInput');
  if(gallery)gallery.onchange=async e=>{await saveOsPhotos(e.target.files);e.target.value=''};
}
function printTemplate(id){let t=templates[id],body=t.groups.map(([g,items])=>`<section><h3>${esc(g)}</h3>${items.map(i=>`<div class="pr"><span>□</span>${esc(i)}</div>`).join('')}</section>`).join('');printWin('Checklist '+t.name,`<h1>Pedro Detail</h1><h2>Checklist Interno — ${esc(t.name)}</h2><p>Cliente: ______________________ Placa: __________ Data: ____/____/______</p>${body}`)}
function printOrder(id){let o=order(id),c=client(o.clientId),v=vehicle(o.vehicleId),groups={};(o.steps||[]).forEach(s=>(groups[s.group]??=[]).push(s));let damages=(o.inspection?.damages||[]).map(d=>`<li>${esc(d.location)} — ${esc(d.type)} — ${esc(d.note||'')}</li>`).join('');printWin('Pedro Detail OS',`<h1>Pedro Detail</h1><h2>OS #${String(o.number).padStart(4,'0')} — ${esc(service(o.serviceId)?.name||'')}</h2><p><b>Cliente:</b> ${esc(c?.name||'')} | <b>Veículo:</b> ${esc(v?.model||'')} | <b>Placa:</b> ${esc(v?.plate||'')}</p><p><b>Entrada:</b> KM ${esc(o.inspection?.km||'')} | Combustível ${esc(o.inspection?.fuel||'')}</p><h3>Avarias registradas</h3><ul>${damages||'<li>Nenhuma</li>'}</ul>${Object.entries(groups).map(([g,rows])=>`<section><h3>${esc(g)}</h3>${rows.map(r=>`<div class="pr"><span>${r.done?'✓':'□'}</span>${esc(r.label)}</div>`).join('')}</section>`).join('')}<h3>Controle de qualidade</h3>${(o.quality||[]).map(q=>`<div class="pr"><span>${q.done?'✓':'□'}</span>${esc(q.label)}</div>`).join('')}<p><b>Total:</b> ${brl(totalOrder(o))} | <b>Recebido:</b> ${brl(paidAmount(o))}</p><p><b>Observações:</b> ${esc(o.notes||'—')}</p><h3>Serviço concluído com cuidado e atenção aos detalhes.</h3>`)}
function printWin(t,b){let w=window.open('','_blank');if(!w)return notify('Permita pop-ups.');w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(t)}</title><style>body{font-family:Arial;color:#111;margin:24px}h2{border-bottom:3px solid #111;padding-bottom:8px}section{border:1px solid #bbb;border-radius:8px;padding:10px;margin:10px 0}.pr{display:flex;gap:9px;padding:5px 0;border-top:1px solid #ddd}@media print{body{margin:10mm}}</style><body>${b}<script>window.onload=()=>window.print()<\/script></body>`);w.document.close()}
function exportBackup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pedro-detail-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);notify('Backup exportado.')}function importBackup(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);state={...defaults(),...x};save();notify('Backup importado.');render()}catch{notify('Backup inválido.')}};r.readAsText(f)}

function globalSearch(q){q=q.toLowerCase().trim();if(!q)return[];let r=[];state.clients.forEach(c=>{if(`${c.name} ${c.phone}`.toLowerCase().includes(q))r.push({t:'Cliente',title:c.name,sub:c.phone||'',action:'open-client',id:c.id})});state.vehicles.forEach(v=>{if(`${v.model} ${v.plate}`.toLowerCase().includes(q))r.push({t:'Veículo',title:v.model,sub:v.plate||'',action:'open-vehicle',id:v.id})});state.orders.forEach(o=>{if(`${o.number} ${client(o.clientId)?.name} ${vehicle(o.vehicleId)?.model} ${vehicle(o.vehicleId)?.plate}`.toLowerCase().includes(q))r.push({t:'OS',title:'OS #'+o.number,sub:client(o.clientId)?.name||'',action:'open-order',id:o.id})});return r.slice(0,20)}

<script>
(function(){
  if(window.__PD_QUOTES__) return;
  window.__PD_QUOTES__=true;

  state.quotes=state.quotes||[];
  state.settings.nextQuote=Number(state.settings.nextQuote||1);

  const st=document.createElement('style');
  st.textContent='.quote-item{border:1px solid #29292e;border-radius:14px;padding:13px;background:#101012;margin-bottom:10px}.quote-item-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.quote-photo-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.quote-photo-strip img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid #29292e}.quote-total{font-size:28px;font-weight:950;color:var(--green)}@media(max-width:560px){.quote-photo-strip{grid-template-columns:1fr 1fr}}';
  document.head.appendChild(st);

  if(!nav.some(n=>n[0]==='quotes')) nav.splice(3,0,['quotes','▤','Orçamentos']);

  const baseRender=render;
  render=function(){
    if(route==='quotes'){renderNav();return renderQuotes()}
    return baseRender()
  };

  const baseHandle=handle;
  handle=async function(action,t){
    const id=t?.dataset?.id||'';
    if(action==='new-quote') return openQuoteForm();
    if(action==='open-quote') return openQuote(id);
    if(action==='edit-quote') return openQuoteForm(id);
    if(action==='quote-add-item'){captureItems();draftItems.push({serviceId:'',name:'',price:0,note:''});renderItems();return}
    if(action==='quote-remove-item'){captureItems();draftItems.splice(Number(t.dataset.index),1);renderItems();return}
    if(action==='quote-download-pdf') return downloadPdf(id);
    if(action==='quote-share-pdf') return sharePdf(id);
    if(action==='quote-delete-photo'){await delPhoto(t.dataset.photo);return openQuote(id)}
    if(action==='delete-quote'){
      if(confirm('Excluir este orçamento?')){
        try{
          const photos=await quotePhotos(id);
          for(const p of photos) await delPhoto(p.id);
        }catch{}
        state.quotes=state.quotes.filter(x=>x.id!==id);
        save();closeModal();notify('Orçamento excluído.');render()
      }
      return
    }
    return baseHandle(action,t)
  };

  const baseSearch=globalSearch;
  globalSearch=function(q){
    const out=baseSearch(q),s=String(q||'').toLowerCase().trim();
    if(!s)return out;
    state.quotes.forEach(x=>{
      if((x.number+' '+(x.clientName||'')+' '+(x.vehicleModel||'')).toLowerCase().includes(s)){
        out.push({t:'Orçamento',title:'Orçamento #'+String(x.number||0).padStart(4,'0'),sub:(x.clientName||'')+' • '+(x.vehicleModel||''),action:'open-quote',id:x.id})
      }
    });
    return out.slice(0,20)
  };

  function qfind(id){return state.quotes.find(x=>x.id===id)}
  function total(q){return (q?.items||[]).reduce((a,x)=>a+Number(x.price||0),0)}
  function dateBR(v){if(!v)return '—';try{return new Date(v+'T12:00:00').toLocaleDateString('pt-BR')}catch{return v}}
  function validUntil(v){const d=v?new Date(v+'T12:00:00'):new Date();d.setDate(d.getDate()+30);return d.toISOString().slice(0,10)}
  function expired(q){return q?.validUntil?Date.now()>new Date(q.validUntil+'T23:59:59').getTime():false}
  function status(q){return expired(q)?'<span class="badge red">Expirado</span>':'<span class="badge green">Válido</span>'}

  async function quotePhotos(id){
    const db=await photoDB();
    return new Promise((res,rej)=>{
      const tx=db.transaction('photos','readonly'),r=tx.objectStore('photos').getAll();
      r.onsuccess=()=>res(r.result.filter(x=>x.quoteId===id));
      r.onerror=()=>rej(r.error)
    })
  }

  function renderQuotes(){
    title('Orçamentos','PEDRO DETAIL • PROPOSTAS');
    const rows=[...state.quotes].sort((a,b)=>Number(b.number||0)-Number(a.number||0));
    const ok=rows.filter(x=>!expired(x)).length,exp=rows.length-ok,sum=rows.reduce((a,x)=>a+total(x),0);
    $('view').innerHTML=`
      <div class="grid cols-3">
        <div class="card metric"><div class="metric-label">ORÇAMENTOS</div><div class="metric-value">${rows.length}</div><div class="metric-sub">propostas cadastradas</div></div>
        <div class="card metric"><div class="metric-label">VÁLIDOS</div><div class="metric-value">${ok}</div><div class="metric-sub">${exp} expirado(s)</div></div>
        <div class="card metric pink"><div class="metric-label">VALOR ORÇADO</div><div class="metric-value">${brl(sum)}</div><div class="metric-sub">soma das propostas</div></div>
      </div>
      <div class="section">
        <div class="section-head">
          <div><h2 class="section-title">Orçamentos</h2><div class="section-sub">Serviços, justificativas, fotos e PDF pronto para enviar ao cliente.</div></div>
          <button class="btn-green" data-action="new-quote">+ Novo orçamento</button>
        </div>
        ${rows.length?`<div class="table-wrap"><table><thead><tr><th>Nº</th><th>CLIENTE</th><th>VEÍCULO</th><th>DATA</th><th>VALIDADE</th><th>TOTAL</th><th>STATUS</th><th></th></tr></thead><tbody>${rows.map(q=>`<tr><td><b>#${String(q.number||0).padStart(4,'0')}</b></td><td>${esc(q.clientName||'')}</td><td>${esc(q.vehicleModel||'')}</td><td>${dateBR(q.date)}</td><td>${dateBR(q.validUntil)}</td><td><b>${brl(total(q))}</b></td><td>${status(q)}</td><td><button class="btn-ghost" data-action="open-quote" data-id="${q.id}">Abrir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">Nenhum orçamento criado ainda.</div>'}
      </div>
    `
  }

  let draftItems=[];
  function serviceOptions(sel=''){
    return '<option value="">Selecione um serviço</option>'+state.services.filter(s=>s.active!==false).map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('')+`<option value="custom" ${sel==='custom'?'selected':''}>Outro / Personalizado</option>`
  }

  function captureItems(){
    const box=$('quoteItemsBox');if(!box)return;
    draftItems=[...box.querySelectorAll('.quote-item')].map(row=>({
      serviceId:row.querySelector('.quote-item-service')?.value||'',
      name:row.querySelector('.quote-item-name')?.value||'',
      price:Number(row.querySelector('.quote-item-price')?.value||0),
      note:row.querySelector('.quote-item-note')?.value||''
    }))
  }

  function renderItems(){
    const box=$('quoteItemsBox');if(!box)return;
    if(!draftItems.length)draftItems=[{serviceId:'',name:'',price:0,note:''}];
    box.innerHTML=draftItems.map((it,i)=>`
      <div class="quote-item">
        <div class="quote-item-head"><b>Serviço ${i+1}</b>${draftItems.length>1?`<button type="button" class="btn-danger" data-action="quote-remove-item" data-index="${i}">Remover</button>`:''}</div>
        <div class="form-grid">
          <div class="field-group"><label class="label">Serviço *</label><select class="select quote-item-service">${serviceOptions(it.serviceId)}</select></div>
          <div class="field-group"><label class="label">Valor</label><input class="field quote-item-price" type="number" step=".01" min="0" value="${Number(it.price||0)}"></div>
          <div class="field-group wide quote-custom ${it.serviceId==='custom'?'':'hidden'}"><label class="label">Nome do serviço</label><input class="field quote-item-name" value="${esc(it.name||'')}"></div>
          <div class="field-group wide"><label class="label">Observação / por que é necessário</label><textarea class="textarea quote-item-note" placeholder="Ex.: pintura com contaminação, chuva ácida, risco superficial...">${esc(it.note||'')}</textarea></div>
        </div>
      </div>
    `).join('');
    box.querySelectorAll('.quote-item-service').forEach(sel=>sel.onchange=e=>{
      const row=e.target.closest('.quote-item'),srv=service(e.target.value),custom=row.querySelector('.quote-custom'),name=row.querySelector('.quote-item-name'),price=row.querySelector('.quote-item-price');
      if(e.target.value==='custom'){custom.classList.remove('hidden');if(name&&!name.value)name.focus()}
      else{custom.classList.add('hidden');if(name)name.value=srv?.name||'';if(price&&srv)price.value=Number(srv.price||0)}
    })
  }

  function openQuoteForm(id=''){
    const q=id?qfind(id):null,dt=q?.date||today();
    draftItems=(q?.items?.length?q.items:[{serviceId:'',name:'',price:0,note:''}]).map(x=>({...x}));
    const clients=state.clients.map(c=>`<option value="${esc(c.name)}">${esc(c.phone||'')}</option>`).join('');
    const cars=state.vehicles.map(v=>`<option value="${esc(v.model)}">${esc(v.plate||'')}</option>`).join('');
    modal(q?'Editar orçamento':'Novo orçamento',`
      <form id="quoteForm">
        <div class="form-grid">
          <div class="field-group"><label class="label">Nome do cliente *</label><input id="quoteClientName" class="field" name="clientName" list="quoteClientList" required value="${esc(q?.clientName||'')}"><datalist id="quoteClientList">${clients}</datalist></div>
          <div class="field-group"><label class="label">WhatsApp</label><input id="quoteClientPhone" class="field" name="clientPhone" inputmode="tel" value="${esc(q?.clientPhone||'')}"></div>
          <div class="field-group"><label class="label">Modelo do carro *</label><input class="field" name="vehicleModel" list="quoteVehicleList" required value="${esc(q?.vehicleModel||'')}"><datalist id="quoteVehicleList">${cars}</datalist></div>
          <div class="field-group"><label class="label">Data do orçamento *</label><input id="quoteDate" class="field" type="date" name="date" required value="${dt}"></div>
          <div class="field-group"><label class="label">Validade</label><input id="quoteValid" class="field" type="date" readonly value="${q?.validUntil||validUntil(dt)}"><div class="hint">30 dias após a emissão.</div></div>
          <div class="field-group wide"><label class="label">Observações gerais</label><textarea class="textarea" name="notes" placeholder="Condições, informações adicionais...">${esc(q?.notes||'')}</textarea></div>
        </div>
        <div class="separator"></div>
        <div class="section-head"><div><h3 style="margin:0">Serviços</h3><div class="hint">Adicione quantos serviços precisar e explique a recomendação de cada um.</div></div><button type="button" class="btn-ghost" data-action="quote-add-item">+ Serviço</button></div>
        <div id="quoteItemsBox"></div>
        <div class="separator"></div>
        <div class="field-group"><label class="label">Fotos do orçamento</label><div class="form-actions"><label class="btn-ghost">📷 Tirar foto<input id="quoteCam" type="file" accept="image/*" capture="environment" hidden></label><label class="btn-ghost">🖼️ Galeria<input id="quoteGallery" type="file" accept="image/*" multiple hidden></label></div><div id="quotePhotoHint" class="hint">${q?'Novas fotos serão adicionadas às existentes.':'As fotos serão anexadas ao PDF.'}</div></div>
        <div class="form-actions" style="margin-top:18px"><button class="btn-green" type="submit">${q?'Salvar alterações':'Criar orçamento'}</button><button class="btn-ghost" type="button" data-action="close-modal">Cancelar</button></div>
      </form>
    `,'ORÇAMENTOS');
    renderItems();
    $('quoteDate').onchange=e=>$('quoteValid').value=validUntil(e.target.value);
    $('quoteClientName').onchange=e=>{const c=state.clients.find(x=>x.name===e.target.value);if(c&&!$('quoteClientPhone').value)$('quoteClientPhone').value=c.phone||''};
    const hint=()=>{const n=($('quoteCam').files?.length||0)+($('quoteGallery').files?.length||0);if(n)$('quotePhotoHint').textContent=n+' foto(s) selecionada(s).'};
    $('quoteCam').onchange=hint;$('quoteGallery').onchange=hint;
    $('quoteForm').onsubmit=async e=>{
      e.preventDefault();captureItems();
      const items=draftItems.map(it=>{const srv=service(it.serviceId),name=it.serviceId==='custom'?it.name:(srv?.name||it.name);return {...it,name:name||'Serviço',price:Number(it.price||0)}}).filter(x=>x.name);
      if(!items.length)return notify('Adicione pelo menos um serviço.');
      const d=Object.fromEntries(new FormData(e.target));let obj=q;
      if(!obj){const n=state.settings.nextQuote++;obj={id:uid('quo'),number:n,createdAt:new Date().toISOString()};state.quotes.push(obj)}
      Object.assign(obj,{clientName:d.clientName,clientPhone:d.clientPhone||'',vehicleModel:d.vehicleModel,date:d.date,validUntil:validUntil(d.date),notes:d.notes||'',items,updatedAt:new Date().toISOString()});
      const files=[...($('quoteCam').files||[]),...($('quoteGallery').files||[])].filter(f=>String(f.type||'').startsWith('image/'));
      if(files.length)notify(files.length>1?'Processando '+files.length+' fotos...':'Processando foto...');
      for(const f of files){try{const blob=await compressImage(f);await putPhoto({id:uid('qph'),quoteId:obj.id,blob,createdAt:new Date().toISOString(),name:f.name||'foto.jpg'})}catch(err){console.error(err)}}
      save();closeModal();notify(q?'Orçamento atualizado.':'Orçamento criado.');await openQuote(obj.id)
    }
  }

  async function openQuote(id){
    const q=qfind(id);if(!q)return;
    let photos=[];try{photos=await quotePhotos(id)}catch{}
    modal('Orçamento #'+String(q.number||0).padStart(4,'0'),`
      <div class="grid cols-3">
        <div class="card soft"><div class="metric-label">CLIENTE</div><h3 style="margin:7px 0">${esc(q.clientName||'')}</h3><div class="hint">${esc(q.clientPhone||'Sem WhatsApp')}</div></div>
        <div class="card soft"><div class="metric-label">VEÍCULO</div><h3 style="margin:7px 0">${esc(q.vehicleModel||'')}</h3><div class="hint">Emissão: ${dateBR(q.date)}</div></div>
        <div class="card soft"><div class="metric-label">VALIDADE</div><h3 style="margin:7px 0;color:${expired(q)?'#ff7979':'var(--green)'}">${expired(q)?'EXPIRADO':'VÁLIDO'}</h3><div class="hint">Até ${dateBR(q.validUntil)}</div></div>
      </div>
      <div class="section card soft">
        <div class="section-head"><div><div class="metric-label">SERVIÇOS PROPOSTOS</div><h3 style="margin:6px 0 0">${q.items.length} item(ns)</h3></div><div class="quote-total">${brl(total(q))}</div></div>
        ${q.items.map((it,i)=>`<div class="quote-item"><div class="row"><div><b>${i+1}. ${esc(it.name)}</b>${it.note?`<div class="hint" style="margin-top:6px">${esc(it.note)}</div>`:''}</div><b>${brl(it.price)}</b></div></div>`).join('')}
        ${q.notes?`<div class="separator"></div><div class="metric-label">OBSERVAÇÕES GERAIS</div><p style="margin:8px 0 0;white-space:pre-wrap">${esc(q.notes)}</p>`:''}
      </div>
      <div class="section card soft">
        <div class="section-head"><div><h3 style="margin:0">Fotos anexadas</h3><div class="hint">${photos.length} foto(s) no orçamento.</div></div></div>
        ${photos.length?`<div class="quote-photo-strip">${photos.map(p=>`<div><img src="${URL.createObjectURL(p.blob)}"><div class="hint" style="margin-top:5px">${fmtDT(p.createdAt)}</div><button class="btn-danger" style="margin-top:5px" data-action="quote-delete-photo" data-id="${id}" data-photo="${p.id}">Excluir</button></div>`).join('')}</div>`:'<div class="empty">Nenhuma foto anexada.</div>'}
      </div>
      <div class="form-actions section">
        <button class="btn-green" data-action="quote-share-pdf" data-id="${id}">📤 Enviar PDF</button>
        <button class="btn-ghost" data-action="quote-download-pdf" data-id="${id}">📄 Baixar PDF</button>
        <button class="btn-ghost" data-action="edit-quote" data-id="${id}">Editar</button>
        <button class="btn-danger" data-action="delete-quote" data-id="${id}">Excluir</button>
      </div>
    `,'ORÇAMENTO')
  }

  function loadPdfLib(){
    if(window.jspdf?.jsPDF)return Promise.resolve(window.jspdf.jsPDF);
    return new Promise((resolve,reject)=>{
      let s=document.getElementById('pdJspdf');
      if(s){s.addEventListener('load',()=>resolve(window.jspdf.jsPDF),{once:true});return}
      s=document.createElement('script');s.id='pdJspdf';s.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';
      s.onload=()=>window.jspdf?.jsPDF?resolve(window.jspdf.jsPDF):reject(new Error('PDF'));
      s.onerror=()=>reject(new Error('PDF'));
      document.head.appendChild(s)
    })
  }

  function blobUrl(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
  function pdfName(q){const n=String(q.clientName||'cliente').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');return 'orcamento-pedro-detail-'+String(q.number||0).padStart(4,'0')+'-'+n+'.pdf'}

  async function makePdf(q){
    const JsPDF=await loadPdfLib(),doc=new JsPDF({unit:'mm',format:'a4'}),W=210,M=15;let y=0;
    const head=()=>{
      doc.setFillColor(7,7,7);doc.rect(0,0,W,38,'F');
      doc.setTextColor(121,255,0);doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text((state.settings.business||'Pedro Detail').toUpperCase(),M,17);
      doc.setTextColor(255,0,200);doc.setFontSize(9);doc.text('ORCAMENTO DE SERVICOS AUTOMOTIVOS',M,25);
      doc.setTextColor(255);doc.text('#'+String(q.number||0).padStart(4,'0'),W-M,17,{align:'right'});doc.text('Validade: '+dateBR(q.validUntil),W-M,25,{align:'right'});y=48
    };
    const room=n=>{if(y+n>280){doc.addPage();head()}};
    head();
    doc.setTextColor(20);doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text('CLIENTE',M,y);doc.setFont('helvetica','normal');doc.text(q.clientName||'',M+26,y);
    doc.setFont('helvetica','bold');doc.text('VEICULO',112,y);doc.setFont('helvetica','normal');doc.text(q.vehicleModel||'',136,y);y+=8;
    doc.setFont('helvetica','bold');doc.text('DATA',M,y);doc.setFont('helvetica','normal');doc.text(dateBR(q.date),M+26,y);y+=10;
    doc.setDrawColor(220);doc.line(M,y,W-M,y);y+=9;
    doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Servicos recomendados',M,y);y+=8;
    for(const [i,it] of q.items.entries()){
      const lines=it.note?doc.splitTextToSize(String(it.note),142):[],h=12+lines.length*4.2;room(h);
      doc.setFillColor(247,247,248);doc.roundedRect(M,y-5,W-2*M,h-3,2,2,'F');
      doc.setTextColor(20);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text((i+1)+'. '+it.name,M+4,y+1);
      doc.text(brl(it.price),W-M-4,y+1,{align:'right'});
      if(lines.length){doc.setTextColor(90);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.text(lines,M+4,y+7)}
      y+=h
    }
    room(25);doc.setDrawColor(220);doc.line(M,y,W-M,y);y+=9;doc.setTextColor(20);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('TOTAL',M,y);doc.setTextColor(45,145,0);doc.setFontSize(17);doc.text(brl(total(q)),W-M,y,{align:'right'});y+=10;
    if(q.notes){
      const l=doc.splitTextToSize(q.notes,W-2*M),h=12+l.length*4.5;room(h);
      doc.setTextColor(20);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Observacoes gerais',M,y);y+=6;
      doc.setTextColor(90);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(l,M,y);y+=l.length*4.5+6
    }
    room(16);doc.setTextColor(100);doc.setFontSize(8.5);doc.text('Orcamento valido por 30 dias a partir da data de emissao.',M,y);y+=5;
    if(state.settings.whatsapp)doc.text('WhatsApp: '+state.settings.whatsapp,M,y);
    if(state.settings.address)doc.text(state.settings.address,W-M,y,{align:'right'});
    let photos=[];try{photos=await quotePhotos(q.id)}catch{}
    if(photos.length){
      doc.addPage();head();doc.setTextColor(20);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Fotos anexadas',M,y);y+=8;
      let col=0;
      for(const p of photos.slice(0,8)){
        if(y+66>280){doc.addPage();head()}
        const x=M+(col%2)*94;
        try{const data=await blobUrl(p.blob);doc.addImage(data,'JPEG',x,y,86,55,undefined,'FAST');doc.setTextColor(100);doc.setFontSize(7.5);doc.text(fmtDT(p.createdAt),x,y+60)}catch{}
        col++;if(col%2===0)y+=67
      }
    }
    const pages=doc.getNumberOfPages();
    for(let p=1;p<=pages;p++){doc.setPage(p);doc.setTextColor(135);doc.setFontSize(7);doc.text((state.settings.business||'Pedro Detail')+' • Orcamento #'+String(q.number||0).padStart(4,'0')+' • Pagina '+p+'/'+pages,W/2,293,{align:'center'})}
    return {blob:doc.output('blob'),filename:pdfName(q)}
  }

  async function downloadPdf(id){
    const q=qfind(id);if(!q)return;
    try{notify('Gerando PDF...');const {blob,filename}=await makePdf(q),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);notify('PDF gerado.')}catch(e){console.error(e);notify('Não foi possível gerar o PDF. Verifique a internet.')}
  }

  async function sharePdf(id){
    const q=qfind(id);if(!q)return;
    try{
      notify('Preparando PDF...');
      const {blob,filename}=await makePdf(q),file=new File([blob],filename,{type:'application/pdf'});
      if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
        await navigator.share({title:'Orçamento Pedro Detail #'+String(q.number||0).padStart(4,'0'),text:'Olá '+(q.clientName||'')+'! Segue seu orçamento da Pedro Detail, válido por 30 dias.',files:[file]});
        notify('PDF compartilhado.')
      }else{
        const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);notify('PDF baixado. Agora envie pelo WhatsApp.')
      }
    }catch(e){if(e?.name!=='AbortError'){console.error(e);notify('Não foi possível compartilhar o PDF.')}}
  }

  render();
})();

</script>
</body></html>
