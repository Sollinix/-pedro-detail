<style>:root{
  --bg:#070707; --panel:#0f0f10; --panel2:#151516; --line:#29292d;
  --text:#f7f7f8; --muted:#a8a8af; --green:#79ff00; --pink:#ff00c8;
  --green-soft:rgba(121,255,0,.12); --pink-soft:rgba(255,0,200,.12);
  --danger:#ff5252; --warn:#ffcf3a; --shadow:0 20px 60px rgba(0,0,0,.35);
  --radius:18px;
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:
radial-gradient(circle at 8% 8%,rgba(121,255,0,.08),transparent 18%),
radial-gradient(circle at 88% 15%,rgba(255,0,200,.07),transparent 20%),var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
.app-shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:rgba(8,8,8,.92);backdrop-filter:blur(18px);display:flex;flex-direction:column;z-index:20}
.brand{padding:20px 14px 22px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:flex-start;gap:10px;position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;left:12px;right:12px;bottom:8px;height:3px;background:linear-gradient(90deg,var(--green),var(--pink));border-radius:10px}
.brand-logo{width:min(100%,210px);height:auto;display:block;filter:drop-shadow(0 0 16px rgba(121,255,0,.18)) drop-shadow(0 0 10px rgba(255,0,200,.12))}
.brand-sub{font-size:10px;letter-spacing:1.7px;color:var(--muted);margin-left:2px}
.nav-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.nav-item{border:0;background:transparent;color:#c9c9cf;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:13px;text-align:left;font-weight:700}
.nav-item:hover{background:#151515;color:#fff}
.nav-item.active{background:linear-gradient(90deg,var(--green-soft),rgba(121,255,0,.03));color:var(--green);box-shadow:inset 3px 0 0 var(--green)}
.nav-icon{width:24px;text-align:center;font-size:18px}
.sidebar-footer{margin-top:auto;display:flex;flex-direction:column;gap:14px;padding:8px}
.offline-badge{font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}
.offline-badge span{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 12px var(--green)}
.main-area{min-width:0;padding:0 28px 50px}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:24px 0 18px;background:linear-gradient(180deg,rgba(7,7,7,.96) 75%,rgba(7,7,7,0));backdrop-filter:blur(8px)}
.eyebrow{font-size:11px;letter-spacing:2.2px;font-weight:900;color:var(--green);margin:0 0 5px}
h1,h2,h3,p{margin-top:0}h1{font-size:30px;margin-bottom:0}h2{font-size:24px;margin-bottom:0}h3{font-size:16px;margin-bottom:8px}
.topbar-actions{display:flex;gap:10px;align-items:center}
.primary-btn,.secondary-btn,.ghost-btn,.danger-btn,.icon-btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800;transition:.15s ease}
.primary-btn{background:var(--green);color:#0b0b0b;border-color:var(--green);box-shadow:0 0 22px rgba(121,255,0,.16)}
.primary-btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
.secondary-btn{background:var(--pink);color:#080808;border-color:var(--pink)}
.ghost-btn{background:#121213;color:#efeff2}.ghost-btn:hover{border-color:#555}
.danger-btn{background:rgba(255,82,82,.1);color:#ff7777;border-color:rgba(255,82,82,.3)}
.icon-btn{width:42px;height:42px;padding:0;background:#121213;color:#fff;font-size:22px;display:grid;place-items:center}
.full{width:100%}
.view{max-width:1450px;margin:0 auto}
.grid{display:grid;gap:16px}.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:linear-gradient(180deg,#121213,#0c0c0d);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card.soft{box-shadow:none;background:#0d0d0e}.card.glow-green{border-color:rgba(121,255,0,.25)}.card.glow-pink{border-color:rgba(255,0,200,.25)}
.metric{display:flex;justify-content:space-between;align-items:flex-start;min-height:130px}.metric-label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.8px}.metric-value{font-size:32px;font-weight:900;margin:10px 0 5px}.metric-foot{font-size:12px;color:var(--muted)}.metric-icon{width:46px;height:46px;border-radius:14px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:22px}.metric-icon.pink{background:var(--pink-soft);color:var(--pink)}
.section{margin-top:20px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}.section-title{font-size:18px;font-weight:900;margin:0}.section-sub{font-size:12px;color:var(--muted);margin:4px 0 0}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.quick-action{border:1px solid var(--line);background:#101011;color:#fff;border-radius:16px;padding:16px;text-align:left;min-height:92px}.quick-action:hover{border-color:#555}.quick-action strong{display:block;margin-top:14px}.quick-action span{color:var(--green);font-size:20px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#0d0d0e}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:13px 14px;border-bottom:1px solid #202023;text-align:left;font-size:13px}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);background:#111113;position:sticky;top:0}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#121214}
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;background:#1a1a1c;color:#ddd;border:1px solid #29292c}.badge.green{background:var(--green-soft);color:var(--green);border-color:rgba(121,255,0,.25)}.badge.pink{background:var(--pink-soft);color:var(--pink);border-color:rgba(255,0,200,.25)}.badge.warn{background:rgba(255,207,58,.1);color:var(--warn);border-color:rgba(255,207,58,.25)}.badge.danger{background:rgba(255,82,82,.1);color:#ff7777;border-color:rgba(255,82,82,.25)}
.empty{padding:36px;text-align:center;color:var(--muted)}.empty .big-icon{font-size:34px;margin-bottom:10px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field-group{display:flex;flex-direction:column;gap:7px}.field-group.full-span{grid-column:1/-1}.label{font-size:12px;color:#d0d0d5;font-weight:800}.field{width:100%;background:#0d0d0e;border:1px solid #333338;color:#fff;border-radius:11px;padding:11px 12px;outline:none}.field:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}textarea.field{min-height:90px;resize:vertical}.field.big{font-size:18px;padding:14px}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.hint{font-size:11px;color:var(--muted);line-height:1.5}
.modal{border:0;background:transparent;width:min(760px,calc(100% - 24px));max-height:92vh;padding:0;color:var(--text)}.modal::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(5px)}.modal-card{background:#0c0c0d;border:1px solid #2a2a2e;border-radius:20px;box-shadow:0 40px 100px rgba(0,0,0,.65);overflow:hidden}.modal-card.compact{max-width:620px;margin:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--line)}.modal-body{padding:20px;max-height:75vh;overflow:auto}
.progress{height:8px;background:#202023;border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--pink));border-radius:99px}.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.order-card{display:grid;grid-template-columns:1.2fr .8fr auto;gap:16px;align-items:center;padding:14px;border-bottom:1px solid #202023}.order-card:last-child{border-bottom:0}.order-main strong{display:block}.order-meta{color:var(--muted);font-size:12px;margin-top:4px}.order-actions{display:flex;gap:8px}
.checklist-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:center}.checklist-hero img{width:100%;max-width:240px;justify-self:end;filter:drop-shadow(0 0 14px rgba(121,255,0,.15))}.checklist-hero .hero-logo{width:150px;max-width:100%;justify-self:start;filter:none}.hero-stack{display:flex;flex-direction:column;gap:10px}.hero-stack h2{margin:0;font-size:24px}.hero-stack p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.checklist-group{border:1px solid #242427;border-radius:14px;overflow:hidden;margin-bottom:14px}.checklist-group-title{padding:10px 12px;background:#131315;font-weight:900;color:var(--green);font-size:12px;text-transform:uppercase;letter-spacing:.6px}.check-row{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;border-top:1px solid #202023}.check-row input{width:18px;height:18px;accent-color:var(--green)}.check-row.done label{text-decoration:line-through;color:#85858b}.check-row label{font-size:13px}
.agenda-list{display:flex;flex-direction:column;gap:10px}.agenda-item{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:15px;background:#0e0e0f}.agenda-date{text-align:center;border-right:1px solid #29292c;padding-right:12px}.agenda-date strong{font-size:20px;display:block;color:var(--green)}.agenda-date span{font-size:11px;color:var(--muted);text-transform:uppercase}.agenda-body strong{display:block}.agenda-body span{color:var(--muted);font-size:12px}
.kpi-row{display:flex;gap:10px;flex-wrap:wrap}.mini-kpi{background:#111113;border:1px solid #27272b;border-radius:12px;padding:10px 12px;min-width:130px}.mini-kpi b{display:block;font-size:19px}.mini-kpi span{font-size:11px;color:var(--muted)}
.stock-low{color:var(--warn);font-weight:800}.money-positive{color:var(--green);font-weight:900}.money-negative{color:#ff7373;font-weight:900}
.list-actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}.toolbar .field{max-width:330px}.toolbar-right{display:flex;gap:8px}
.empty-state{border:1px dashed #33333a;border-radius:16px;padding:30px;text-align:center;color:var(--muted)}
.search-results{display:flex;flex-direction:column;gap:8px;margin-top:14px}.search-result{padding:12px;border:1px solid var(--line);border-radius:12px;background:#111113}.search-result small{color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;z-index:200;background:#141416;border:1px solid #333;border-left:4px solid var(--green);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
.mobile-nav{display:none}
.chart{display:flex;gap:8px;align-items:end;height:140px;padding-top:10px}.bar{flex:1;min-width:18px;background:linear-gradient(180deg,var(--green),rgba(121,255,0,.15));border-radius:8px 8px 3px 3px;position:relative}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.separator{height:1px;background:var(--line);margin:16px 0}
.link-btn{background:none;border:0;color:var(--green);padding:0;font-weight:800}
@media(max-width:1050px){.grid.cols-4{grid-template-columns:repeat(2,1fr)}.grid.cols-3{grid-template-columns:repeat(2,1fr)}.quick-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
  .app-shell{display:block}.sidebar{display:none}.main-area{padding:0 14px 88px}.topbar{padding-top:16px}.topbar .eyebrow{display:none}.topbar h1{font-size:25px}.icon-btn{width:40px;height:40px}.primary-btn{padding:10px 12px}
  .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field-group.full-span{grid-column:auto}.metric{min-height:110px}.metric-value{font-size:28px}.toolbar{align-items:stretch;flex-direction:column}.toolbar .field{max-width:none}.toolbar-right{justify-content:flex-end}.checklist-hero{grid-template-columns:1fr}.checklist-hero img{justify-self:start;max-width:170px}
  .order-card{grid-template-columns:1fr;gap:10px}.agenda-item{grid-template-columns:70px 1fr}.agenda-item>button{grid-column:1/-1}.modal{width:calc(100% - 14px)}.modal-body{padding:16px}.modal-head{padding:16px}
  .mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:8px;right:8px;bottom:8px;z-index:100;background:rgba(14,14,15,.94);border:1px solid #303034;backdrop-filter:blur(16px);border-radius:18px;padding:6px;box-shadow:0 18px 60px rgba(0,0,0,.55)}
  .mobile-nav button{background:transparent;border:0;color:#aaa;padding:7px 4px;font-size:10px;font-weight:800;border-radius:12px}.mobile-nav button span{display:block;font-size:20px;margin-bottom:2px}.mobile-nav button.active{background:var(--green-soft);color:var(--green)}
}
@media print{body{background:#fff;color:#000}.app-shell,.mobile-nav,.modal,.toast{display:none!important}}

/* iPhone / PWA safe-area support */
@supports (padding: max(0px)) {
  body { padding-top: env(safe-area-inset-top); }
  @media(max-width:760px){
    .main-area{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));padding-bottom:calc(92px + env(safe-area-inset-bottom));}
    .mobile-nav{left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));}
  }
}

let state = loadState();

const el = id => document.getElementById(id);

function loadState(){
  try{ const raw=localStorage.getItem(STORAGE_KEY); if(raw) return {...defaultState(),...JSON.parse(raw)}; }catch(e){}
  return defaultState();
}
function saveState(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
function uid(prefix='id'){ return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowLocal(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function brl(v){ return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0)); }
function fmtDate(v){ if(!v)return '—'; const d=new Date(v.length===10?`${v}T12:00:00`:v); return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d); }
function fmtDateTime(v){ if(!v)return '—'; const d=new Date(v); return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d); }
function esc(s=''){ return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function service(id){ return state.services.find(x=>x.id===id); }
function client(id){ return state.clients.find(x=>x.id===id); }
function vehicle(id){ return state.vehicles.find(x=>x.id===id); }
function orderById(id){ return state.orders.find(x=>x.id===id); }
function notify(msg){ const t=el('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function setRoute(r){ route=r; location.hash=`#/${r}`; render(); }
function statusBadge(status){
  const map={aberta:['Aberta','warn'],em_andamento:['Em andamento','pink'],concluida:['Concluída','green'],cancelada:['Cancelada','danger'],agendado:['Agendado','warn'],confirmado:['Confirmado','green'],atendido:['Atendido','green']};
  const [label,cls]=map[status]||[status,'']; return `<span class="badge ${cls}">${label}</span>`;
}
function paymentBadge(status){ const map={pendente:['Pendente','warn'],pago:['Pago','green'],parcial:['Parcial','pink']}; const [l,c]=map[status]||[status,'']; return `<span class="badge ${c}">${l}</span>`; }

function renderNav(){
  el('sideNav').innerHTML = NAV.map(([r,i,n])=>`<button class="nav-item ${route===r?'active':''}" data-route="${r}"><span class="nav-icon">${i}</span>${n}</button>`).join('');
  const mobile = [['dashboard','⌂','Início'],['agenda','◷','Agenda'],['os','✓','OS'],['clientes','♙','Clientes'],['config','•••','Mais']];
  el('mobileNav').innerHTML = mobile.map(([r,i,n])=>`<button class="${route===r?'active':''}" data-route="${r}"><span>${i}</span>${n}</button>`).join('');
}

function render(){
  renderNav();
  const pages={dashboard:renderDashboard,agenda:renderAgenda,os:renderOrders,clientes:renderClients,veiculos:renderVehicles,checklists:renderChecklists,estoque:renderStock,financeiro:renderFinance,config:renderSettings};
  (pages[route]||renderDashboard)();
  window.scrollTo({top:0,behavior:'instant'});
}
function title(name,eyebrow='PEDRO DETAIL'){ el('pageTitle').textContent=name; el('pageEyebrow').textContent=eyebrow; }


function renderDashboard(){
  title('Dashboard','VISÃO GERAL');
  const today=todayISO();
  const dayOrders=state.orders.filter(o=>o.date?.slice(0,10)===today);
  const paidToday=dayOrders.filter(o=>o.paymentStatus==='pago').reduce((a,o)=>a+Number(o.price||0),0);
  const inProgress=state.orders.filter(o=>o.status==='em_andamento').length;
  const apptsToday=state.appointments.filter(a=>a.date?.slice(0,10)===today && a.status!=='atendido').length;
  const monthKey=today.slice(0,7);
  const revenueMonth=state.orders.filter(o=>o.paymentStatus==='pago'&&o.date?.slice(0,7)===monthKey).reduce((a,o)=>a+Number(o.price||0),0);
  const expensesMonth=state.expenses.filter(x=>x.date?.slice(0,7)===monthKey).reduce((a,x)=>a+Number(x.amount||0),0);
  const recent=[...state.orders].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,6);
  const low=state.stock.filter(s=>Number(s.qty)<=Number(s.min||0));
  const bars=last7DaysRevenue();
  el('view').innerHTML=`
    <div class="grid cols-4">
      ${metric('Faturamento hoje',brl(paidToday),'Recebido em OS pagas','R$',false)}
      ${metric('OS em andamento',inProgress,'Serviços em execução','✓',true)}
      ${metric('Agenda de hoje',apptsToday,'Atendimentos pendentes','◷',false)}
      ${metric('Resultado do mês',brl(revenueMonth-expensesMonth),`${brl(revenueMonth)} entradas • ${brl(expensesMonth)} saídas`,'↗',true)}
    </div>
    <div class="section">
      <div class="section-head"><div><h2 class="section-title">Ações rápidas</h2><p class="section-sub">Abra o que você mais usa no dia a dia.</p></div></div>
      <div class="quick-grid">
        ${quick('＋','Nova ordem de serviço','new-order')}${quick('◷','Novo agendamento','new-appointment')}${quick('♙','Cadastrar cliente','new-client')}${quick('▱','Cadastrar veículo','new-vehicle')}
      </div>
    </div>
    <div class="section grid cols-2">
      <div class="card">
        <div class="section-head"><div><h2 class="section-title">Faturamento — 7 dias</h2><p class="section-sub">Somente pagamentos marcados como pagos.</p></div></div>
        <div class="chart">${bars.map(b=>`<div class="bar" style="height:${b.h}%" title="${esc(b.label)}: ${brl(b.value)}"><span>${esc(b.short)}</span></div>`).join('')}</div>
      </div>
      <div class="card">
        <div class="section-head"><div><h2 class="section-title">Estoque baixo</h2><p class="section-sub">Produtos no mínimo ou abaixo do mínimo.</p></div><button class="link-btn" data-route="estoque">Ver estoque</button></div>
        ${low.length?low.slice(0,6).map(s=>`<div class="order-card"><div class="order-main"><strong>${esc(s.name)}</strong><div class="order-meta">${esc(s.unit||'un')} • mínimo ${s.min||0}</div></div><div class="stock-low">${s.qty} ${esc(s.unit||'un')}</div></div>`).join(''):'<div class="empty">Nenhum item em alerta.</div>'}
      </div>
    </div>
    <div class="section card">
      <div class="section-head"><div><h2 class="section-title">Ordens recentes</h2><p class="section-sub">Acompanhe o andamento sem sair do dashboard.</p></div><button class="link-btn" data-route="os">Ver todas</button></div>
      ${recent.length?recent.map(orderRow).join(''):'<div class="empty"><div class="big-icon">✓</div>Nenhuma ordem criada ainda.</div>'}
    </div>`;
}
function metric(label,value,foot,icon,pink){return `<div class="card metric"><div><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></div><div class="metric-icon ${pink?'pink':''}">${icon}</div></div>`}
function quick(icon,label,action){return `<button class="quick-action" data-action="${action}"><span>${icon}</span><strong>${label}</strong></button>`}
function last7DaysRevenue(){
  const arr=[]; let max=1;
  for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-i); const key=d.toISOString().slice(0,10); const v=state.orders.filter(o=>o.paymentStatus==='pago'&&o.date?.slice(0,10)===key).reduce((a,o)=>a+Number(o.price||0),0); max=Math.max(max,v); arr.push({label:key,value:v,short:new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(d).replace('.','')}); }
  return arr.map(x=>({...x,h:Math.max(5,Math.round(x.value/max*100))}));
}

function agendaSearchText(a){ return `${client(a.clientId)?.name||''} ${vehicle(a.vehicleId)?.model||''} ${vehicle(a.vehicleId)?.plate||''} ${service(a.serviceId)?.name||''}`.toLowerCase(); }
function agendaHTML(items){

  return items.map(a=>{const d=new Date(a.date);return `<div class="agenda-item"><div class="agenda-date"><strong>${String(d.getDate()).padStart(2,'0')}</strong><span>${new Intl.DateTimeFormat('pt-BR',{month:'short'}).format(d)}</span></div><div class="agenda-body"><strong>${esc(client(a.clientId)?.name||'Cliente')} • ${esc(service(a.serviceId)?.name||'Serviço')}</strong><span>${esc(vehicle(a.vehicleId)?.model||'Veículo')} ${vehicle(a.vehicleId)?.plate?'• '+esc(vehicle(a.vehicleId).plate):''} • ${new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(d)}</span><div style="margin-top:7px">${statusBadge(a.status)}</div></div><button class="ghost-btn" data-action="edit-appointment" data-id="${a.id}">Abrir</button></div>`}).join('');

function orderSearchText(o){ return `${o.number} ${client(o.clientId)?.name||''} ${vehicle(o.vehicleId)?.model||''} ${vehicle(o.vehicleId)?.plate||''} ${service(o.serviceId)?.name||''}`.toLowerCase(); }
function orderProgress(o){ const total=o.steps?.length||0; const done=o.steps?.filter(s=>s.done).length||0; return total?Math.round(done/total*100):0; }
function orderRow(o){ const c=client(o.clientId),v=vehicle(o.vehicleId),s=service(o.serviceId),p=orderProgress(o); return `<div class="order-card"><div class="order-main"><strong>OS #${String(o.number).padStart(4,'0')} • ${esc(c?.name||'Cliente')}</strong><div class="order-meta">${esc(v?.model||'Veículo')} ${v?.plate?'• '+esc(v.plate):''} • ${esc(s?.name||'Serviço')} • ${fmtDate(o.date)}</div><div style="margin-top:8px">${statusBadge(o.status)} ${paymentBadge(o.paymentStatus)}</div></div><div><div class="progress"><span style="width:${p}%"></span></div><div class="progress-label"><span>Checklist</span><span>${p}%</span></div></div><div class="order-actions"><button class="ghost-btn" data-action="open-order" data-id="${o.id}">Abrir</button></div></div>`; }

function renderStock(){
  title('Estoque','PRODUTOS E INSUMOS');
  const rows=state.stock.map(s=>`<tr><td><strong>${esc(s.name)}</strong><br><span class="hint">${esc(s.category||'Sem categoria')}</span></td><td class="${Number(s.qty)<=Number(s.min||0)?'stock-low':''}">${s.qty} ${esc(s.unit||'un')}</td><td>${s.min||0}</td><td>${brl(s.cost||0)}</td><td><div class="list-actions"><button class="ghost-btn" data-action="edit-stock" data-id="${s.id}">Editar</button><button class="danger-btn" data-action="delete-stock" data-id="${s.id}">Excluir</button></div></td></tr>`).join('');
  el('view').innerHTML=`<div class="toolbar"><div class="kpi-row"><div class="mini-kpi"><b>${state.stock.length}</b><span>Itens cadastrados</span></div><div class="mini-kpi"><b>${state.stock.filter(s=>Number(s.qty)<=Number(s.min||0)).length}</b><span>Em alerta</span></div></div><div class="toolbar-right"><button class="primary-btn" data-action="new-stock">+ Produto</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Quantidade</th><th>Mínimo</th><th>Custo unit.</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="5"><div class="empty">Nenhum produto cadastrado.</div></td></tr>'}</tbody></table></div>`;
}

function renderFinance(){
  title('Financeiro','CAIXA');
  const month=todayISO().slice(0,7);
  const income=state.orders.filter(o=>o.paymentStatus==='pago'&&o.date?.slice(0,7)===month).reduce((a,o)=>a+Number(o.price||0),0);
  const exp=state.expenses.filter(e=>e.date?.slice(0,7)===month).reduce((a,e)=>a+Number(e.amount||0),0);
  const recentExp=[...state.expenses].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);
  el('view').innerHTML=`<div class="grid cols-3">${metric('Entradas do mês',brl(income),'OS marcadas como pagas','↗',false)}${metric('Saídas do mês',brl(exp),'Despesas lançadas','↘',true)}${metric('Resultado',brl(income-exp),'Entradas menos saídas','R$',false)}</div><div class="section grid cols-2"><div class="card"><div class="section-head"><div><h2 class="section-title">Despesas</h2><p class="section-sub">Produtos, manutenção, combustível e outros custos.</p></div><button class="primary-btn" data-action="new-expense">+ Despesa</button></div>${recentExp.length?recentExp.map(e=>`<div class="order-card"><div class="order-main"><strong>${esc(e.description)}</strong><div class="order-meta">${fmtDate(e.date)} • ${esc(e.category||'Outros')}</div></div><div class="money-negative">-${brl(e.amount)}</div><button class="danger-btn" data-action="delete-expense" data-id="${e.id}">Excluir</button></div>`).join(''):'<div class="empty">Nenhuma despesa lançada.</div>'}</div><div class="card"><div class="section-head"><div><h2 class="section-title">Recebimentos recentes</h2><p class="section-sub">Ordens com pagamento concluído.</p></div></div>${state.orders.filter(o=>o.paymentStatus==='pago').slice(-10).reverse().map(o=>`<div class="order-card"><div class="order-main"><strong>OS #${String(o.number).padStart(4,'0')} • ${esc(client(o.clientId)?.name||'Cliente')}</strong><div class="order-meta">${esc(service(o.serviceId)?.name||'Serviço')} • ${fmtDate(o.date)}</div></div><div class="money-positive">+${brl(o.price)}</div></div>`).join('')||'<div class="empty">Nenhum recebimento.</div>'}</div></div>`;
}

function renderSettings(){
  title('Configurações','SISTEMA');
  const serviceRows=state.services.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td><input class="field service-price" data-id="${s.id}" type="number" min="0" step="0.01" value="${s.price||0}"></td><td><input class="field service-duration" data-id="${s.id}" type="number" min="0" value="${s.duration||0}"></td><td>${s.template?`<span class="badge green">Checklist</span>`:'<span class="badge">Genérico</span>'}</td></tr>`).join('');
  el('view').innerHTML=`<div class="grid cols-2"><div class="card"><div class="section-head"><div><h2 class="section-title">Dados da empresa</h2><p class="section-sub">Usados em relatórios e impressões.</p></div></div><div class="form-grid"><div class="field-group full-span"><label class="label">Nome</label><input id="settingBusiness" class="field" value="${esc(state.settings.business||'Pedro Detail')}"></div><div class="field-group"><label class="label">WhatsApp</label><input id="settingWhats" class="field" value="${esc(state.settings.whatsapp||'')}"></div><div class="field-group"><label class="label">Endereço / referência</label><input id="settingAddress" class="field" value="${esc(state.settings.address||'')}"></div></div><div class="form-actions"><button class="primary-btn" data-action="save-settings">Salvar</button></div></div><div class="card"><div class="section-head"><div><h2 class="section-title">Backup</h2><p class="section-sub">Seus dados ficam neste navegador. Faça backup regularmente.</p></div></div><div class="list-actions"><button class="primary-btn" data-action="backup-export">Exportar JSON</button><label class="ghost-btn">Importar backup<input id="backupInput" type="file" accept="application/json" hidden></label><button class="danger-btn" data-action="reset-system">Apagar dados</button></div><p class="hint" style="margin-top:14px">O sistema não envia seus dados para nenhum servidor. Isso mantém tudo gratuito e privado, mas trocar de celular/computador exige importar um backup.</p></div></div><div class="section table-wrap"><table class="table"><thead><tr><th>Serviço</th><th>Preço padrão</th><th>Duração (min)</th><th>Checklist</th></tr></thead><tbody>${serviceRows}</tbody></table></div>`;
  el('backupInput').addEventListener('change',importBackup);
}

function openModal(titleText,body,eyebrow='PEDRO DETAIL'){
  el('modalTitle').textContent=titleText; el('modalEyebrow').textContent=eyebrow; el('modalBody').innerHTML=body; el('modal').showModal();
}
function closeModal(){ el('modal').close(); }


function clientForm(c={}){return `<form id="clientForm"><div class="form-grid"><div class="field-group full-span"><label class="label">Nome *</label><input name="name" class="field" required value="${esc(c.name||'')}"></div><div class="field-group"><label class="label">WhatsApp / telefone</label><input name="phone" class="field" inputmode="tel" value="${esc(c.phone||'')}"></div><div class="field-group"><label class="label">E-mail</label><input name="email" class="field" type="email" value="${esc(c.email||'')}"></div><div class="field-group full-span"><label class="label">Observações</label><textarea name="notes" class="field">${esc(c.notes||'')}</textarea></div></div><div class="form-actions"><button type="button" class="ghost-btn" data-action="close-modal">Cancelar</button><button class="primary-btn">Salvar cliente</button></div></form>`}
function openClient(id){ const c=id?client(id):{}; openModal(id?'Editar cliente':'Novo cliente',clientForm(c),'CLIENTES'); el('clientForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(id)Object.assign(c,d);else state.clients.push({id:uid('cli'),...d,createdAt:new Date().toISOString()});saveState();closeModal();notify('Cliente salvo.');render();}); }
function vehicleForm(v={}){return `<form id="vehicleForm"><div class="form-grid"><div class="field-group full-span"><label class="label">Cliente *</label><select name="clientId" class="field" required><option value="">Selecione</option>${state.clients.map(c=>`<option value="${c.id}" ${v.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field-group"><label class="label">Modelo *</label><input name="model" class="field" required value="${esc(v.model||'')}"></div><div class="field-group"><label class="label">Placa</label><input name="plate" class="field" style="text-transform:uppercase" value="${esc(v.plate||'')}"></div><div class="field-group"><label class="label">Cor</label><input name="color" class="field" value="${esc(v.color||'')}"></div><div class="field-group"><label class="label">Ano</label><input name="year" class="field" value="${esc(v.year||'')}"></div><div class="field-group full-span"><label class="label">Observações</label><textarea name="notes" class="field">${esc(v.notes||'')}</textarea></div></div><div class="form-actions"><button type="button" class="ghost-btn" data-action="close-modal">Cancelar</button><button class="primary-btn">Salvar veículo</button></div></form>`}
function openVehicle(id){ if(!state.clients.length){notify('Cadastre um cliente primeiro.');openClient();return;} const v=id?vehicle(id):{};openModal(id?'Editar veículo':'Novo veículo',vehicleForm(v),'VEÍCULOS');el('vehicleForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.plate=d.plate.toUpperCase();if(id)Object.assign(v,d);else state.vehicles.push({id:uid('vei'),...d,createdAt:new Date().toISOString()});saveState();closeModal();notify('Veículo salvo.');render();}); }

function appointmentForm(a={}){return `<form id="appointmentForm"><div class="form-grid"><div class="field-group"><label class="label">Cliente *</label><select id="apptClient" name="clientId" class="field" required><option value="">Selecione</option>${state.clients.map(c=>`<option value="${c.id}" ${a.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field-group"><label class="label">Veículo *</label><select id="apptVehicle" name="vehicleId" class="field" required>${vehicleOptions(a.clientId,a.vehicleId)}</select></div><div class="field-group"><label class="label">Serviço *</label><select name="serviceId" class="field" required><option value="">Selecione</option>${state.services.filter(s=>s.active).map(s=>`<option value="${s.id}" ${a.serviceId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field-group"><label class="label">Data e hora *</label><input name="date" type="datetime-local" class="field" required value="${a.date?localInputValue(a.date):nowLocal()}"></div><div class="field-group"><label class="label">Status</label><select name="status" class="field"><option value="agendado" ${a.status==='agendado'?'selected':''}>Agendado</option><option value="confirmado" ${a.status==='confirmado'?'selected':''}>Confirmado</option><option value="atendido" ${a.status==='atendido'?'selected':''}>Atendido</option></select></div><div class="field-group"><label class="label">Observações</label><input name="notes" class="field" value="${esc(a.notes||'')}"></div></div><div class="form-actions">${a.id?'<button type="button" class="danger-btn" data-action="delete-appointment" data-id="'+a.id+'">Excluir</button>':''}<button type="button" class="ghost-btn" data-action="close-modal">Cancelar</button><button class="primary-btn">Salvar</button></div></form>`}
function localInputValue(v){const d=new Date(v);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function vehicleOptions(clientId,selected){const vs=state.vehicles.filter(v=>!clientId||v.clientId===clientId);return `<option value="">Selecione</option>${vs.map(v=>`<option value="${v.id}" ${v.id===selected?'selected':''}>${esc(v.model)} ${v.plate?'• '+esc(v.plate):''}</option>`).join('')}`}
function openAppointment(id){if(!state.clients.length){notify('Cadastre um cliente primeiro.');openClient();return;}const a=id?state.appointments.find(x=>x.id===id):{};openModal(id?'Editar agendamento':'Novo agendamento',appointmentForm(a),'AGENDA');const cs=el('apptClient'),vs=el('apptVehicle');cs.addEventListener('change',()=>vs.innerHTML=vehicleOptions(cs.value,''));el('appointmentForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.date=new Date(d.date).toISOString();if(id)Object.assign(a,d);else state.appointments.push({id:uid('ag'),...d,createdAt:new Date().toISOString()});saveState();closeModal();notify('Agendamento salvo.');render();});}

function cloneSteps(templateId){ const t=templates[templateId]; if(!t)return [{group:'Serviço',label:'Serviço concluído',done:false}]; return t.groups.flatMap(g=>g[1].map(label=>({group:g[0],label,done:false}))); }
function nextOrderNumber(){return Math.max(0,...state.orders.map(o=>Number(o.number)||0))+1}
function orderForm(o={}){return `<form id="orderForm"><div class="form-grid"><div class="field-group"><label class="label">Cliente *</label><select id="orderClient" name="clientId" class="field" required><option value="">Selecione</option>${state.clients.map(c=>`<option value="${c.id}" ${o.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field-group"><label class="label">Veículo *</label><select id="orderVehicle" name="vehicleId" class="field" required>${vehicleOptions(o.clientId,o.vehicleId)}</select></div><div class="field-group"><label class="label">Serviço *</label><select id="orderService" name="serviceId" class="field" required><option value="">Selecione</option>${state.services.filter(s=>s.active).map(s=>`<option value="${s.id}" ${o.serviceId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field-group"><label class="label">Valor</label><input id="orderPrice" name="price" class="field" type="number" min="0" step="0.01" value="${o.price??''}"></div><div class="field-group"><label class="label">Data</label><input name="date" class="field" type="date" value="${o.date?.slice(0,10)||todayISO()}"></div><div class="field-group"><label class="label">Pagamento</label><select name="paymentStatus" class="field"><option value="pendente">Pendente</option><option value="parcial">Parcial</option><option value="pago">Pago</option></select></div><div class="field-group"><label class="label">Forma de pagamento</label><select name="paymentMethod" class="field"><option>Pix</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>Outro</option></select></div><div class="field-group"><label class="label">Status</label><select name="status" class="field"><option value="aberta">Aberta</option><option value="em_andamento">Em andamento</option><option value="concluida">Concluída</option></select></div><div class="field-group full-span"><label class="label">Observações</label><textarea name="notes" class="field">${esc(o.notes||'')}</textarea></div></div><div class="form-actions"><button type="button" class="ghost-btn" data-action="close-modal">Cancelar</button><button class="primary-btn">Criar ordem</button></div></form>`}
function openNewOrder(){ if(!state.clients.length){notify('Cadastre um cliente primeiro.');openClient();return;} if(!state.vehicles.length){notify('Cadastre um veículo primeiro.');openVehicle();return;} openModal('Nova ordem de serviço',orderForm(),'ORDENS DE SERVIÇO'); const cs=el('orderClient'),vs=el('orderVehicle'),ss=el('orderService'),price=el('orderPrice'); cs.addEventListener('change',()=>vs.innerHTML=vehicleOptions(cs.value,'')); ss.addEventListener('change',()=>{const s=service(ss.value);if(s)price.value=s.price||''}); el('orderForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const s=service(d.serviceId);state.orders.push({id:uid('os'),number:nextOrderNumber(),...d,price:Number(d.price||0),createdAt:new Date().toISOString(),steps:cloneSteps(s?.template)});saveState();closeModal();notify('Ordem criada.');render();}); }

function openOrder(id){const o=orderById(id);if(!o)return;const grouped={};(o.steps||[]).forEach((s,i)=>{(grouped[s.group]??=[]).push([s,i])});const p=orderProgress(o);openModal(`OS #${String(o.number).padStart(4,'0')}`,`<div class="grid cols-2"><div class="card soft"><div class="metric-label">CLIENTE</div><h3 style="margin-top:6px">${esc(client(o.clientId)?.name||'—')}</h3><p class="hint">${esc(vehicle(o.vehicleId)?.model||'—')} ${vehicle(o.vehicleId)?.plate?'• '+esc(vehicle(o.vehicleId).plate):''}</p></div><div class="card soft"><div class="metric-label">SERVIÇO</div><h3 style="margin-top:6px">${esc(service(o.serviceId)?.name||'—')}</h3><p class="hint">${brl(o.price)} • ${fmtDate(o.date)}</p></div></div><div class="separator"></div><div class="progress"><span style="width:${p}%"></span></div><div class="progress-label"><span>Progresso do checklist</span><span>${p}%</span></div><div style="margin-top:16px">${Object.entries(grouped).map(([g,rows])=>`<div class="checklist-group"><div class="checklist-group-title">${esc(g)}</div>${rows.map(([s,i])=>`<div class="check-row ${s.done?'done':''}"><input type="checkbox" data-action="toggle-step" data-order="${o.id}" data-step="${i}" ${s.done?'checked':''}><label>${esc(s.label)}</label></div>`).join('')}</div>`).join('')}</div><div class="separator"></div><div class="form-grid"><div class="field-group"><label class="label">Status</label><select id="orderStatusEdit" class="field"><option value="aberta" ${o.status==='aberta'?'selected':''}>Aberta</option><option value="em_andamento" ${o.status==='em_andamento'?'selected':''}>Em andamento</option><option value="concluida" ${o.status==='concluida'?'selected':''}>Concluída</option><option value="cancelada" ${o.status==='cancelada'?'selected':''}>Cancelada</option></select></div><div class="field-group"><label class="label">Pagamento</label><select id="orderPaymentEdit" class="field"><option value="pendente" ${o.paymentStatus==='pendente'?'selected':''}>Pendente</option><option value="parcial" ${o.paymentStatus==='parcial'?'selected':''}>Parcial</option><option value="pago" ${o.paymentStatus==='pago'?'selected':''}>Pago</option></select></div></div><div class="form-actions"><button class="danger-btn" data-action="delete-order" data-id="${o.id}">Excluir</button><button class="ghost-btn" data-action="print-order" data-id="${o.id}">Imprimir entrega</button><button class="primary-btn" data-action="save-order-status" data-id="${o.id}">Salvar</button></div>`,'ORDEM DE SERVIÇO');}

function stockForm(s={}){return `<form id="stockForm"><div class="form-grid"><div class="field-group full-span"><label class="label">Produto *</label><input name="name" class="field" required value="${esc(s.name||'')}"></div><div class="field-group"><label class="label">Categoria</label><input name="category" class="field" value="${esc(s.category||'')}"></div><div class="field-group"><label class="label">Unidade</label><input name="unit" class="field" placeholder="ml, L, un..." value="${esc(s.unit||'un')}"></div><div class="field-group"><label class="label">Quantidade</label><input name="qty" class="field" type="number" step="0.01" value="${s.qty??0}"></div><div class="field-group"><label class="label">Estoque mínimo</label><input name="min" class="field" type="number" step="0.01" value="${s.min??0}"></div><div class="field-group"><label class="label">Custo unitário</label><input name="cost" class="field" type="number" step="0.01" value="${s.cost??0}"></div></div><div class="form-actions"><button type="button" class="ghost-btn" data-action="close-modal">Cancelar</button><button class="primary-btn">Salvar</button></div></form>`}
function openStock(id){const s=id?state.stock.find(x=>x.id===id):{};openModal(id?'Editar produto':'Novo produto',stockForm(s),'ESTOQUE');el('stockForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));['qty','min','cost'].forEach(k=>d[k]=Number(d[k]||0));if(id)Object.assign(s,d);else state.stock.push({id:uid('stk'),...d});saveState();closeModal();notify('Estoque atualizado.');render();});}
function expenseForm(){return `<form id="expenseForm"><div class="form-grid"><div class="field-group full-span"><label class="label">Descrição *</label><input name="description" class="field" required></div><div class="field-group"><label class="label">Valor *</label><input name="amount" class="field" required type="number" min="0" step="0.01"></div><div class="field-group"><label class="label">Data</label><input name="date" class="field" type="date" value="${todayISO()}"></div><div class="field-group full-span"><label class="label">Categoria</label><select name="category" class="field"><option>Produtos</option><option>Combustível</option><option>Manutenção</option><option>Marketing</option><option>Equipamentos</option><option>Outros</option></select></div></div><div class="form-actions"><button type="button" class="ghost-btn" data-action="close-modal">Cancelar</button><button class="primary-btn">Lançar despesa</button></div></form>`}
function openExpense(){openModal('Nova despesa',expenseForm(),'FINANCEIRO');el('expenseForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.amount=Number(d.amount);state.expenses.push({id:uid('exp'),...d});saveState();closeModal();notify('Despesa lançada.');render();});}

function previewTemplate(id){const t=templates[id];openModal(t.name,templateHTML(t),'CHECKLIST INTERNO');}
function templateHTML(t){return t.groups.map(([g,items])=>`<div class="checklist-group"><div class="checklist-group-title">${esc(g)}</div>${items.map(i=>`<div class="check-row"><input type="checkbox" disabled><label>${esc(i)}</label></div>`).join('')}</div>`).join('');}

function printWindow(title,body){const w=window.open('','_blank');if(!w){notify('Permita pop-ups para imprimir.');return;}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;color:#111;margin:24px;max-width:900px}h1{font-size:34px;margin:0}h2{border-bottom:3px solid #111;padding-bottom:10px}.print-brand{display:flex;align-items:center;gap:16px;margin-bottom:16px}.print-brand img{width:160px;height:auto}.print-brand p{margin:4px 0 0;color:#555}section{border:1px solid #bbb;border-radius:8px;padding:12px;margin:12px 0}h3{margin:0 0 8px}.print-row{padding:6px 0;border-top:1px solid #ddd;display:flex;gap:10px}.print-row:first-of-type{border-top:0}@media print{body{margin:10mm}}</style></head><body>${body}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close();}

function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pedro-detail-backup-${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href);notify('Backup exportado.');}
function importBackup(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data.services||!data.settings)throw new Error();state={...defaultState(),...data};saveState();notify('Backup importado.');render();}catch{notify('Arquivo de backup inválido.');}};r.readAsText(f);}

function globalSearch(q){q=q.trim().toLowerCase();if(!q)return [];const out=[];state.clients.forEach(c=>{if(`${c.name} ${c.phone}`.toLowerCase().includes(q))out.push({type:'Cliente',title:c.name,sub:c.phone||'',route:'clientes'})});state.vehicles.forEach(v=>{if(`${v.model} ${v.plate}`.toLowerCase().includes(q))out.push({type:'Veículo',title:v.model,sub:`${v.plate||''} • ${client(v.clientId)?.name||''}`,route:'veiculos'})});state.orders.forEach(o=>{if(orderSearchText(o).includes(q))out.push({type:'OS',title:`OS #${String(o.number).padStart(4,'0')} • ${client(o.clientId)?.name||''}`,sub:`${vehicle(o.vehicleId)?.model||''} • ${service(o.serviceId)?.name||''}`,action:'open-order',id:o.id})});return out.slice(0,20)}
function openSearch(){el('searchModal').showModal();setTimeout(()=>el('globalSearch').focus(),50);el('globalSearch').value='';el('searchResults').innerHTML='<div class="hint">Digite para pesquisar clientes, veículos e ordens.</div>';}

function saveSettings(){state.settings.business=el('settingBusiness').value.trim()||'Pedro Detail';state.settings.whatsapp=el('settingWhats').value.trim();state.settings.address=el('settingAddress').value.trim();document.querySelectorAll('.service-price').forEach(i=>service(i.dataset.id).price=Number(i.value||0));document.querySelectorAll('.service-duration').forEach(i=>service(i.dataset.id).duration=Number(i.value||0));saveState();notify('Configurações salvas.');render();}


function handleAction(action,target){const id=target.dataset.id;
  if(action==='close-modal')return closeModal(); if(action==='quick-search')return openSearch(); if(action==='close-search')return el('searchModal').close();
  if(action==='new-client')return openClient(); if(action==='edit-client')return openClient(id); if(action==='new-vehicle')return openVehicle(); if(action==='edit-vehicle')return openVehicle(id);
  if(action==='new-appointment')return openAppointment(); if(action==='edit-appointment')return openAppointment(id); if(action==='new-order')return openNewOrder(); if(action==='open-order')return openOrder(id);
  if(action==='new-stock')return openStock(); if(action==='edit-stock')return openStock(id); if(action==='new-expense')return openExpense();
  if(action==='preview-template')return previewTemplate(id); if(action==='print-template')return printTemplate(id); if(action==='print-order')return printOrder(id);
  if(action==='backup-export')return exportBackup(); if(action==='save-settings')return saveSettings();
  if(action==='delete-client'){if(confirm('Excluir este cliente?')){state.clients=state.clients.filter(x=>x.id!==id);saveState();render();}} 
  if(action==='delete-vehicle'){if(confirm('Excluir este veículo?')){state.vehicles=state.vehicles.filter(x=>x.id!==id);saveState();render();}}
  if(action==='delete-stock'){if(confirm('Excluir este produto?')){state.stock=state.stock.filter(x=>x.id!==id);saveState();render();}}
  if(action==='delete-expense'){if(confirm('Excluir esta despesa?')){state.expenses=state.expenses.filter(x=>x.id!==id);saveState();render();}}
  if(action==='delete-appointment'){if(confirm('Excluir este agendamento?')){state.appointments=state.appointments.filter(x=>x.id!==id);saveState();closeModal();render();}}
  if(action==='delete-order'){if(confirm('Excluir esta ordem?')){state.orders=state.orders.filter(x=>x.id!==id);saveState();closeModal();render();}}
  if(action==='save-order-status'){const o=orderById(id);o.status=el('orderStatusEdit').value;o.paymentStatus=el('orderPaymentEdit').value;saveState();closeModal();notify('Ordem atualizada.');render();}
  if(action==='reset-system'){if(confirm('Isso apagará todos os dados deste navegador. Deseja continuar?')){localStorage.removeItem(STORAGE_KEY);state=defaultState();saveState();notify('Sistema reiniciado.');render();}}
}

document.addEventListener('click',e=>{const r=e.target.closest('[data-route]');if(r){setRoute(r.dataset.route);return;}const a=e.target.closest('[data-action]');if(a)handleAction(a.dataset.action,a);});
document.addEventListener('change',e=>{if(e.target.matches('[data-action="toggle-step"]')){const o=orderById(e.target.dataset.order);const i=Number(e.target.dataset.step);o.steps[i].done=e.target.checked;if(o.status==='aberta'&&e.target.checked)o.status='em_andamento';if(o.steps.every(s=>s.done))o.status='concluida';saveState();openOrder(o.id);}});
el('globalSearch').addEventListener('input',e=>{const res=globalSearch(e.target.value);el('searchResults').innerHTML=res.length?res.map(x=>`<button class="search-result" style="text-align:left;width:100%;color:#fff" ${x.action?`data-action="${x.action}" data-id="${x.id}"`:`data-route="${x.route}"`}><strong>${esc(x.title)}</strong><br><small>${esc(x.type)} • ${esc(x.sub)}</small></button>`).join(''):'<div class="empty">Nenhum resultado.</div>';});
window.addEventListener('hashchange',()=>{route=location.hash.replace('#/','')||'dashboard';render();});

render();
</script>
